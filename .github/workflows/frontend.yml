name: frontend

on:
  push:
    branches: [main]
    # Tag de release (ex.: v1.4.0) — numa criação de tag o GitHub não tem um
    # "before" sha significativo pra comparar, então o `paths:` abaixo não
    # filtra nada: toda tag de release builda a imagem, ponto de corte oficial.
    tags: ["v*.*.*"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # vitest 4/jsdom 30 exigem Node >=22 (jsdom quer especificamente
          # ^22.22.2 || ^24.15.0 || >=26); Node 20 fazia `npm ci` falhar
          # ("lock file out of sync") porque o npm 10 do Node 20 resolve a
          # arvore de optionalDependencies do esbuild diferente do npm 11
          # usado pra gerar o package-lock.json.
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm run test

      - name: Build
        run: npm run build

      - name: Auditoria de dependências de produção
        run: npm audit --production

  # Só roda em push na main (nunca em PR) e só depois do job `build` passar.
  # Combinado com o `paths:` do gatilho acima, a imagem só é gerada quando
  # frontend/** muda — sem imagem nova por alteração em backend/ ou flutter/.
  build-and-push-image:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` é sempre a tag atual: em push na main (edge) ou em QUALQUER
      # tag vX.Y.Z (release) — sem depender de comparação semver, a tag que
      # acabou de ser processada é sempre a mais atual.
      - name: Metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/starchef-frontend
          flavor: |
            latest=false
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      # Sem secrets/API_URL no build: o bundle é same-origin (/api/v1) e o
      # nginx injeta window.RUNTIME_CONFIG via runtime-config.js.template no
      # start do container (ver Dockerfile) — a MESMA imagem serve qualquer ambiente.
      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
