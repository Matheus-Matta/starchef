name: frontend

on:
  push:
    branches: [main]
    # Tag de release (ex.: v1.4.0) — numa criação de tag o GitHub não tem um
    # "before" sha significativo pra comparar, então o `paths:` abaixo não
    # filtra nada: toda tag de release builda a imagem, ponto de corte oficial.
    tags: ["v*.*.*"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # vitest 4/jsdom 30 exigem Node >=22 (jsdom quer especificamente
          # ^22.22.2 || ^24.15.0 || >=26); Node 20 fazia `npm ci` falhar
          # ("lock file out of sync") porque o npm 10 do Node 20 resolve a
          # arvore de optionalDependencies do esbuild diferente do npm 11
          # usado pra gerar o package-lock.json.
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm run test

      - name: Build
        run: npm run build

      - name: Auditoria de dependências de produção
        run: npm audit --production

  # Só roda em tag vX.Y.Z (nunca em push direto na main nem em PR) e só depois
  # do job `build` passar. Commit direto na main nunca gera imagem — só a tag
  # de release builda e publica, pra backend/frontend/flutter saírem sempre
  # com a MESMA versão sem duplicar build a cada commit.
  build-and-push-image:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Historico completo: o passo abaixo compara esta tag com a anterior.
          fetch-depth: 0

      # Uma tag do monorepo corta backend, frontend e PDV de uma vez, mas nem
      # todo release mexe nos tres. Sem esta checagem, uma correcao so no PDV
      # publicava uma imagem de frontend byte a byte identica a anterior — build de
      # varios minutos, camada nova no GHCR e nada de diferente dentro.
      #
      # A conta e por ARQUIVO ALTERADO desde a tag anterior, nao pela versao
      # declarada: esquecer de subir uma versao faria a correcao NAO ser
      # publicada, em silencio — falha bem pior do que uma imagem a mais.
      - name: Decidir se a imagem precisa ser reconstruida
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 --match 'v*.*.*'             "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [[ -z "$previous" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Sem release anterior para comparar: imagem sera construida."
          elif git diff --quiet "$previous" "$GITHUB_SHA" --               frontend .github/workflows/frontend.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nada mudou em frontend/ desde $previous: a imagem atual sera apenas re-etiquetada."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/ mudou desde $previous: imagem sera reconstruida."
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Esse job só roda em tag, então `latest` sempre acompanha a tag atual
      # sem precisar de condição extra.
      - name: Metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/starchef-frontend
          flavor: |
            latest=false
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # Sem secrets/API_URL no build: o bundle é same-origin (/api/v1) e o
      # docker-entrypoint.sh injeta window.RUNTIME_CONFIG via
      # runtime-config.js.template no start do container (ver Dockerfile) —
      # a MESMA imagem serve qualquer ambiente.
      - name: Build e push
        if: steps.changed.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      # Nada mudou: em vez de reconstruir, aponta as etiquetas desta versao
      # para a imagem que ja esta publicada. Nao gera camada nova nem consome
      # espaco — sao apenas nomes novos para o MESMO digest — e mantem a
      # pergunta "qual frontend rodava no release X.Y.Z?" respondivel.
      - name: Re-etiquetar a imagem existente
        if: steps.changed.outputs.changed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/starchef-frontend"
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create             --tag "$image:$version"             --tag "$image:${version%.*}"             "$image:latest"

  # Poda o GHCR por idade: qualquer versão (tag ou sem tag) com mais de 1 ano
  # vira lixo e é apagada, MENOS a que estiver com a tag `latest` no momento —
  # essa fica protegida sempre, não importa a idade.
  cleanup-old-images:
    needs: build-and-push-image
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: starchef-frontend
          older-than: 1 year
          exclude-tags: latest
          delete-untagged: true
