name: pdv-desktop

# Só o PDV Windows/Linux. O atendimento móvel tem workflow próprio
# (`pdv_mobile.yml`) e não passa mais por aqui.
#
# Os dois reagem à MESMA tag `vX.Y.Z`, cada um por conta própria, e anexam ao
# MESMO GitHub Release. O que os coordena é o `concurrency` do job de
# publicação, compartilhado entre os dois arquivos. Antes o desktop CHAMAVA o
# mobile (`workflow_call`), o que fazia uma mudança só no Android passar pelo
# pipeline do instalador do Windows — e o APK só sair se o desktop chegasse lá.
#
# Cada produto publica o manifesto dele: `latest-desktop.json` aqui,
# `latest-mobile.json` no workflow do móvel.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "pdv_desktop/**"
      - ".github/workflows/pdv_desktop.yml"
  pull_request:
    paths:
      - "pdv_desktop/**"
      - ".github/workflows/pdv_desktop.yml"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API_BASE_URL do build (vazio = variável PDV_API_BASE_URL)"
        required: false
        type: string
      sentry_dsn:
        description: "PDV_SENTRY_DSN do build (vazio = secret PDV_SENTRY_DSN)"
        required: false
        type: string
      update_manifest_url:
        description: "URL do latest-desktop.json (vazio = GitHub Releases deste repositório)"
        required: false
        type: string

defaults:
  run:
    working-directory: pdv_desktop

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Instalar dependências
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # `flutter test` roda em windows-latest, o runner hospedado mais lento
      # do GitHub Actions, e alguns testes fazem I/O real de disco (SQLite
      # temporário) sob timers reais — com a suíte inteira disputando disco em
      # paralelo, um pico de contenção pontual pode estourar até uma folga
      # generosa. Uma repetição automática absorve essa flakiness transitória
      # sem esconder regressão de verdade: uma falha real reproduz nas duas
      # tentativas e continua barrando o release.
      - name: Testes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $maxAttempts = 2
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            flutter test
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt $maxAttempts) {
              Write-Host "::warning::flutter test falhou na tentativa $attempt/$maxAttempts — tentando novamente (possível flakiness de I/O no runner Windows)."
              Start-Sleep -Seconds 5
            }
          }
          exit $LASTEXITCODE

  # O pubspec é a fonte da versão do binário e a tag é a fonte da versão do
  # release. O pipeline para antes do build se os dois valores divergirem.
  release-metadata:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # O histórico inteiro: o passo abaixo compara esta tag com a
          # anterior, e com o clone raso do padrão não existe tag anterior
          # para comparar.
          fetch-depth: 0

      - name: Conferir tag x versão do pubspec.yaml
        id: version
        shell: bash
        run: |
          set -euo pipefail
          full_version="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          version="${full_version%%+*}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versão inválida no pubspec.yaml: $full_version" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
              echo "Tag ${GITHUB_REF_NAME} não bate com pubspec.yaml (${version})." >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"


  build-windows:
    needs: release-metadata
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: windows-latest
    env:
      API_BASE_URL: ${{ inputs.api_base_url || vars.PDV_API_BASE_URL }}
      PDV_SENTRY_DSN: ${{ inputs.sentry_dsn || secrets.PDV_SENTRY_DSN }}
      CUSTOM_UPDATE_MANIFEST_URL: ${{ inputs.update_manifest_url || vars.PDV_UPDATE_MANIFEST_URL }}
      APP_VERSION: ${{ needs.release-metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Instalar dependências
        run: flutter pub get

      - name: Build Windows (release)
        shell: pwsh
        run: |
          if (-not $env:API_BASE_URL) {
            throw "API_BASE_URL não definido. Configure PDV_API_BASE_URL ou informe api_base_url."
          }
          $manifestUrl = $env:CUSTOM_UPDATE_MANIFEST_URL
          if (-not $manifestUrl) {
            $manifestUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/latest-desktop.json"
          }
          $defines = @(
            "--dart-define=API_BASE_URL=$env:API_BASE_URL",
            "--dart-define=PDV_UPDATE_MANIFEST_URL=$manifestUrl"
          )
          if ($env:PDV_SENTRY_DSN) {
            $defines += "--dart-define=PDV_SENTRY_DSN=$env:PDV_SENTRY_DSN"
          }
          flutter build windows --release @defines
          if ($LASTEXITCODE -ne 0) {
            throw "flutter build windows falhou com código $LASTEXITCODE"
          }

      - name: Gerar instalador (Inno Setup)
        shell: pwsh
        run: .\windows\installer\build_installer.ps1

      - name: Gerar ZIP portátil do Windows
        shell: pwsh
        run: |
          $output = "..\artifacts\StarChef-PDV-Windows-v$env:APP_VERSION.zip"
          Compress-Archive -Path ".\build\windows\x64\runner\Release\*" -DestinationPath $output -Force

      - name: Upload dos pacotes Windows
        uses: actions/upload-artifact@v4
        with:
          name: starchef-pdv-windows-${{ needs.release-metadata.outputs.version }}
          path: |
            artifacts/StarChef-PDV-Setup-*.exe
            artifacts/StarChef-PDV-Windows-v*.zip
          if-no-files-found: error

  build-linux:
    needs: release-metadata
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ inputs.api_base_url || vars.PDV_API_BASE_URL }}
      PDV_SENTRY_DSN: ${{ inputs.sentry_dsn || secrets.PDV_SENTRY_DSN }}
      CUSTOM_UPDATE_MANIFEST_URL: ${{ inputs.update_manifest_url || vars.PDV_UPDATE_MANIFEST_URL }}
      APP_VERSION: ${{ needs.release-metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar bibliotecas do Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev libcurl4-openssl-dev zip

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Instalar dependências
        run: flutter pub get

      - name: Build Linux (release)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${API_BASE_URL:-}" ]]; then
            echo "API_BASE_URL não definido. Configure PDV_API_BASE_URL ou informe api_base_url." >&2
            exit 1
          fi
          manifest_url="${CUSTOM_UPDATE_MANIFEST_URL:-}"
          if [[ -z "$manifest_url" ]]; then
            manifest_url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest-desktop.json"
          fi
          defines=(
            "--dart-define=API_BASE_URL=${API_BASE_URL}"
            "--dart-define=PDV_UPDATE_MANIFEST_URL=${manifest_url}"
          )
          if [[ -n "${PDV_SENTRY_DSN:-}" ]]; then
            defines+=("--dart-define=PDV_SENTRY_DSN=${PDV_SENTRY_DSN}")
          fi
          flutter config --enable-linux-desktop
          flutter build linux --release "${defines[@]}"

      - name: Gerar ZIP do Linux
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../artifacts
          cd build/linux/x64/release/bundle
          zip -r "$GITHUB_WORKSPACE/artifacts/StarChef-PDV-Linux-v${APP_VERSION}.zip" .

      - name: Upload do pacote Linux
        uses: actions/upload-artifact@v4
        with:
          name: starchef-pdv-linux-${{ needs.release-metadata.outputs.version }}
          path: artifacts/StarChef-PDV-Linux-v*.zip
          if-no-files-found: error

  # Reúne os três pacotes do PDV, calcula os hashes e publica o manifesto junto
  # do Release. O APK do atendimento móvel NÃO passa por aqui: ele é anexado ao
  # mesmo Release pelo `pdv_mobile.yml`, com manifesto próprio.
  publish-release:
    needs: [release-metadata, build-windows, build-linux]
    if: >-
      github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # O workflow do atendimento móvel publica no MESMO Release. Este grupo é
    # compartilhado com o `publish-mobile` de `pdv_mobile.yml`: os dois nunca
    # mexem no Release ao mesmo tempo, e quem chegar primeiro cria. Sem isso,
    # os dois podem tentar criar o mesmo release e um recebe 422.
    concurrency:
      group: gh-release-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      APP_VERSION: ${{ needs.release-metadata.outputs.version }}
    steps:
      - name: Baixar pacotes dos builds
        uses: actions/download-artifact@v4
        with:
          pattern: starchef-pdv-*-${{ needs.release-metadata.outputs.version }}
          path: release-assets
          merge-multiple: true

      - name: Gerar latest-desktop.json com SHA-256
        shell: python
        working-directory: .
        run: |
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import urlopen

          root = Path(os.environ["GITHUB_WORKSPACE"])
          assets = root / "release-assets"
          version = os.environ["APP_VERSION"]
          tag = os.environ["GITHUB_REF_NAME"]
          repository = os.environ["GITHUB_REPOSITORY"]

          names = {
              "windows_installer": f"StarChef-PDV-Setup-{version}.exe",
              "windows_zip": f"StarChef-PDV-Windows-v{version}.zip",
              "linux_zip": f"StarChef-PDV-Linux-v{version}.zip",
          }
          # Os três são obrigatórios: o manifesto existe para servi-los.
          for key in names:
              if not (assets / names[key]).is_file():
                  raise SystemExit(f"Artefato obrigatório ausente: {names[key]}")

          def package(key, kind, file_format, recommended):
              name = names[key]
              path = assets / name
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              return {
                  "kind": kind,
                  "format": file_format,
                  "name": name,
                  "url": f"https://github.com/{repository}/releases/download/{tag}/{quote(name)}",
                  "sha256": digest,
                  "size": path.stat().st_size,
                  "recommended": recommended,
              }

          manifest = {
              "schema_version": 1,
              "version": version,
              "tag": tag,
              "published_at": datetime.now(timezone.utc).isoformat(),
              "commit": os.environ["GITHUB_SHA"],
              "release_url": f"https://github.com/{repository}/releases/tag/{tag}",
              "platforms": {
                  "windows": {
                      "packages": [
                          package("windows_installer", "installer", "exe", True),
                          package("windows_zip", "portable", "zip", False),
                      ]
                  },
                  "linux": {
                      "packages": [
                          package("linux_zip", "portable", "zip", True),
                      ]
                  },
              },
          }
          # `latest-desktop.json`, e NUNCA `latest.json`.
          #
          # As duas linhagens do PDV convivem: a 1.8.x (offline, pasta
          # `flutter/` das outras branches) publica e consome `latest.json`.
          # Escrever esse nome aqui faria o PDV ANTIGO enxergar a 3.0.0 como
          # atualizacao, baixar um ZIP cujo executavel tem outro nome e ou
          # recusa-lo a cada verificacao, ou aplica-lo — trocando um PDV que
          # vende sem internet por um que nao vende.
          #
          # O nome tambem precisa bater com o que o app desta linhagem pede em
          # `pdv_desktop/lib/core/update/pdv_update_service.dart`: o asset do
          # Release E a URL, entao um nome diferente aqui e um 404 la.
          (assets / "latest-desktop.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

      - name: Guardar pacote completo do release no Actions
        uses: actions/upload-artifact@v4
        with:
          name: starchef-pdv-release-${{ needs.release-metadata.outputs.version }}
          path: release-assets/*
          if-no-files-found: error

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
