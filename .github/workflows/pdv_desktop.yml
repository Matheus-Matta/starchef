name: pdv-desktop

# Só o PDV Windows/Linux. O atendimento móvel tem workflow próprio
# (`pdv_mobile.yml`) e não passa mais por aqui.
#
# Os dois reagem à MESMA tag `vX.Y.Z`, cada um por conta própria, e anexam ao
# MESMO GitHub Release. O que os coordena é o `concurrency` do job de
# publicação, compartilhado entre os dois arquivos. Antes o desktop CHAMAVA o
# mobile (`workflow_call`), o que fazia uma mudança só no Android passar pelo
# pipeline do instalador do Windows — e o APK só sair se o desktop chegasse lá.
#
# Cada produto publica o manifesto dele: `latest-desktop.json` aqui,
# `latest-mobile.json` no workflow do móvel.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "pdv_desktop/**"
      - ".github/workflows/pdv_desktop.yml"
  pull_request:
    paths:
      - "pdv_desktop/**"
      - ".github/workflows/pdv_desktop.yml"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API_BASE_URL do build (vazio = variável PDV_API_BASE_URL)"
        required: false
        type: string
      sentry_dsn:
        description: "PDV_SENTRY_DSN do build (vazio = secret PDV_SENTRY_DSN)"
        required: false
        type: string
      update_manifest_url:
        description: "URL do latest-desktop.json (vazio = GitHub Releases deste repositório)"
        required: false
        type: string

defaults:
  run:
    working-directory: pdv_desktop

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # VERSÃO FIXA, não `channel: stable`. O canal entrega sempre o mais
          # novo, e isso já custou duas releases num dia: um lint novo
          # reprovou a v3.0.19 e a máquina nova derrubou a v3.0.22 — as duas
          # sem uma linha de código alterada. Subir o Flutter passa a ser um
          # commit que alguém revisa, e não uma surpresa na hora de publicar.
          channel: "stable"
          flutter-version: "3.44.4"

      - name: Instalar dependências
        run: flutter pub get

      - name: Tamanho de arquivo (catraca de 200 linhas)
        working-directory: ${{ github.workspace }}
        run: python3 scripts/check_tamanho_de_arquivo.py
      - name: Analyze
        run: flutter analyze

      # `flutter test` roda em windows-latest, o runner hospedado mais lento
      # do GitHub Actions, e alguns testes fazem I/O real de disco (SQLite
      # temporário) sob timers reais — com a suíte inteira disputando disco em
      # paralelo, um pico de contenção pontual pode estourar até uma folga
      # generosa. Uma repetição automática absorve essa flakiness transitória
      # sem esconder regressão de verdade: uma falha real reproduz nas duas
      # tentativas e continua barrando o release.
      - name: Testes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $maxAttempts = 2
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            flutter test
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt $maxAttempts) {
              Write-Host "::warning::flutter test falhou na tentativa $attempt/$maxAttempts — tentando novamente (possível flakiness de I/O no runner Windows)."
              Start-Sleep -Seconds 5
            }
          }
          exit $LASTEXITCODE

  # O pubspec é a fonte da versão do binário e a tag é a fonte da versão do
  # release. O pipeline para antes do build se os dois valores divergirem.
  release-metadata:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # O histórico inteiro: o passo abaixo compara esta tag com a
          # anterior, e com o clone raso do padrão não existe tag anterior
          # para comparar.
          fetch-depth: 0

      - name: Conferir tag x versão do pubspec.yaml
        id: version
        shell: bash
        run: |
          set -euo pipefail
          full_version="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          version="${full_version%%+*}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versão inválida no pubspec.yaml: $full_version" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
              echo "Tag ${GITHUB_REF_NAME} não bate com pubspec.yaml (${version})." >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"


  build-windows:
    needs: release-metadata
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: windows-latest
    env:
      API_BASE_URL: ${{ inputs.api_base_url || vars.PDV_API_BASE_URL }}
      PDV_SENTRY_DSN: ${{ inputs.sentry_dsn || secrets.PDV_SENTRY_DSN }}
      CUSTOM_UPDATE_MANIFEST_URL: ${{ inputs.update_manifest_url || vars.PDV_UPDATE_MANIFEST_URL }}
      APP_VERSION: ${{ needs.release-metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # VERSÃO FIXA, não `channel: stable`. O canal entrega sempre o mais
          # novo, e isso já custou duas releases num dia: um lint novo
          # reprovou a v3.0.19 e a máquina nova derrubou a v3.0.22 — as duas
          # sem uma linha de código alterada. Subir o Flutter passa a ser um
          # commit que alguém revisa, e não uma surpresa na hora de publicar.
          channel: "stable"
          flutter-version: "3.44.4"

      - name: Instalar dependências
        run: flutter pub get

      - name: Build Windows (release)
        shell: pwsh
        run: |
          if (-not $env:API_BASE_URL) {
            throw "API_BASE_URL não definido. Configure PDV_API_BASE_URL ou informe api_base_url."
          }
          $manifestUrl = $env:CUSTOM_UPDATE_MANIFEST_URL
          if (-not $manifestUrl) {
            $manifestUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/latest-desktop.json"
          }
          $defines = @(
            "--dart-define=API_BASE_URL=$env:API_BASE_URL",
            "--dart-define=PDV_UPDATE_MANIFEST_URL=$manifestUrl"
          )
          if ($env:PDV_SENTRY_DSN) {
            $defines += "--dart-define=PDV_SENTRY_DSN=$env:PDV_SENTRY_DSN"
          }
          flutter build windows --release @defines
          if ($LASTEXITCODE -ne 0) {
            throw "flutter build windows falhou com código $LASTEXITCODE"
          }

      - name: Executável com o nome da linhagem 1.8.x
        shell: pwsh
        run: |
          # ANTES do instalador E do ZIP, de propósito. Os dois pacotes
          # precisam do arquivo, por motivos diferentes:
          #
          # O ZIP, porque o atualizador do PDV antigo procura
          # `starchef_pdv.exe` dentro dele e RECUSA o pacote quando não o
          # encontra — a migração falharia a cada abertura, sem nunca concluir.
          #
          # O INSTALADOR, porque o `AppId` é o mesmo nas duas linhagens: a 3.x
          # instala POR CIMA da 1.8.x, na mesma pasta. Sem esta cópia, o
          # `starchef_pdv.exe` ANTIGO sobrevive à atualização e os atalhos que
          # já existem continuam apontando para ele. O operador clica no ícone
          # de sempre e abre o PDV velho — parece que não atualizou, porque o
          # que ele clica realmente não atualizou.
          #
          # O Flutter no Windows localiza `data\` ao lado do executável e não
          # pelo nome dele, então os dois arquivos rodam o mesmo aplicativo.
          $release = ".\build\windows\x64\runner\Release"
          $novo = Join-Path $release "starchef_pdv_desktop.exe"
          if (-not (Test-Path $novo)) {
            throw "Executável não encontrado em $novo — o nome do binário mudou?"
          }
          Copy-Item $novo (Join-Path $release "starchef_pdv.exe") -Force

      - name: Gerar instalador (Inno Setup)
        shell: pwsh
        run: .\windows\installer\build_installer.ps1

      - name: Gerar ZIP portátil do Windows
        shell: pwsh
        run: |
          $release = ".\build\windows\x64\runner\Release"
          $output = "..\artifacts\StarChef-PDV-Windows-v$env:APP_VERSION.zip"
          Compress-Archive -Path "$release\*" -DestinationPath $output -Force

      - name: Upload dos pacotes Windows
        uses: actions/upload-artifact@v4
        with:
          name: starchef-pdv-windows-${{ needs.release-metadata.outputs.version }}
          path: |
            artifacts/StarChef-PDV-Setup-*.exe
            artifacts/StarChef-PDV-Windows-v*.zip
          if-no-files-found: error

  build-linux:
    needs: release-metadata
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')
    # FIXO, e não `ubuntu-latest`. O `latest` migrou de 22.04 para 24.04 e
    # derrubou o build do Linux sem ninguém tocar no código: a v3.0.21
    # compilou e a v3.0.22, com o MESMO `pdv_desktop` (só o número da versão
    # mudou), não. Quem empacota binário não pode ter a máquina trocada
    # debaixo dele por um apelido.
    runs-on: ubuntu-22.04
    env:
      API_BASE_URL: ${{ inputs.api_base_url || vars.PDV_API_BASE_URL }}
      PDV_SENTRY_DSN: ${{ inputs.sentry_dsn || secrets.PDV_SENTRY_DSN }}
      CUSTOM_UPDATE_MANIFEST_URL: ${{ inputs.update_manifest_url || vars.PDV_UPDATE_MANIFEST_URL }}
      APP_VERSION: ${{ needs.release-metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar bibliotecas do Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev libcurl4-openssl-dev zip

      - uses: subosito/flutter-action@v2
        with:
          # VERSÃO FIXA, não `channel: stable`. O canal entrega sempre o mais
          # novo, e isso já custou duas releases num dia: um lint novo
          # reprovou a v3.0.19 e a máquina nova derrubou a v3.0.22 — as duas
          # sem uma linha de código alterada. Subir o Flutter passa a ser um
          # commit que alguém revisa, e não uma surpresa na hora de publicar.
          channel: "stable"
          flutter-version: "3.44.4"

      - name: Instalar dependências
        run: flutter pub get

      - name: Build Linux (release)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${API_BASE_URL:-}" ]]; then
            echo "API_BASE_URL não definido. Configure PDV_API_BASE_URL ou informe api_base_url." >&2
            exit 1
          fi
          manifest_url="${CUSTOM_UPDATE_MANIFEST_URL:-}"
          if [[ -z "$manifest_url" ]]; then
            manifest_url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest-desktop.json"
          fi
          defines=(
            "--dart-define=API_BASE_URL=${API_BASE_URL}"
            "--dart-define=PDV_UPDATE_MANIFEST_URL=${manifest_url}"
          )
          if [[ -n "${PDV_SENTRY_DSN:-}" ]]; then
            defines+=("--dart-define=PDV_SENTRY_DSN=${PDV_SENTRY_DSN}")
          fi
          flutter config --enable-linux-desktop
          flutter build linux --release "${defines[@]}"

      - name: Gerar ZIP do Linux
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../artifacts
          cd build/linux/x64/release/bundle
          zip -r "$GITHUB_WORKSPACE/artifacts/StarChef-PDV-Linux-v${APP_VERSION}.zip" .

      - name: Upload do pacote Linux
        uses: actions/upload-artifact@v4
        with:
          name: starchef-pdv-linux-${{ needs.release-metadata.outputs.version }}
          path: artifacts/StarChef-PDV-Linux-v*.zip
          if-no-files-found: error

  # Reúne os três pacotes do PDV, calcula os hashes e publica o manifesto junto
  # do Release. O APK do atendimento móvel NÃO passa por aqui: ele é anexado ao
  # mesmo Release pelo `pdv_mobile.yml`, com manifesto próprio.
  publish-release:
    needs: [release-metadata, build-windows, build-linux]
    # `always()` porque este job precisa rodar MESMO com o build quebrado.
    # O motivo é o mesmo que o `publish-mobile` já documenta: o app procura o
    # manifesto em `releases/latest/download/`, e `latest` passa a ser o
    # release DESTA tag assim que ele existe — e quem o cria primeiro costuma
    # ser o workflow do mobile, que leva 2 minutos contra os 12 daqui. Se este
    # job não publicasse um `latest-desktop.json`, a URL responderia 404 e
    # TODO PDV em campo pararia de conseguir checar atualização, em silêncio,
    # até alguém publicar outra tag. Foi o que aconteceu na v3.0.1, cujo
    # release ficou permanentemente sem manifesto.
    if: >-
      always() && github.event_name == 'push' && github.ref_type == 'tag' &&
      needs.release-metadata.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # O workflow do atendimento móvel publica no MESMO Release. Este grupo é
    # compartilhado com o `publish-mobile` de `pdv_mobile.yml`: os dois nunca
    # mexem no Release ao mesmo tempo, e quem chegar primeiro cria. Sem isso,
    # os dois podem tentar criar o mesmo release e um recebe 422.
    concurrency:
      group: gh-release-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      APP_VERSION: ${{ needs.release-metadata.outputs.version }}
    steps:
      - name: Baixar pacotes dos builds
        if: >-
          needs.build-windows.result == 'success' &&
          needs.build-linux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: starchef-pdv-*-${{ needs.release-metadata.outputs.version }}
          path: release-assets
          merge-multiple: true

      - name: Gerar latest-desktop.json com SHA-256
        shell: python
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          root = Path(os.environ["GITHUB_WORKSPACE"])
          assets = root / "release-assets"
          assets.mkdir(parents=True, exist_ok=True)
          version = os.environ["APP_VERSION"]
          tag = os.environ["GITHUB_REF_NAME"]
          repository = os.environ["GITHUB_REPOSITORY"]

          names = {
              "windows_installer": f"StarChef-PDV-Setup-{version}.exe",
              "windows_zip": f"StarChef-PDV-Windows-v{version}.zip",
              "linux_zip": f"StarChef-PDV-Linux-v{version}.zip",
          }

          def package(key, kind, file_format, recommended):
              name = names[key]
              path = assets / name
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              return {
                  "kind": kind,
                  "format": file_format,
                  "name": name,
                  "url": f"https://github.com/{repository}/releases/download/{tag}/{quote(name)}",
                  "sha256": digest,
                  "size": path.stat().st_size,
                  "recommended": recommended,
              }

          def herdado():
              # O manifesto do release anterior que AINDA tem os pacotes.
              #
              # Vale quando o build desta tag nao produziu os tres artefatos.
              # Publicar o manifesto anterior mantem as URLs de download
              # validas e diz a verdade ao PDV: a ultima versao utilizavel
              # continua sendo a X. O terminal fica onde esta, que e o
              # comportamento certo -- em vez de receber 404 e parar de checar.
              #
              # A busca e pela API e NAO por `releases/latest`: neste instante
              # o `latest` ja pode ser o release desta tag, criado pelo
              # workflow do mobile, que nao tem manifesto de desktop nenhum.
              pedido = Request(
                  f"https://api.github.com/repos/{repository}/releases?per_page=30",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urlopen(pedido, timeout=30) as resposta:
                  releases = json.load(resposta)

              # A API devolve do mais novo para o mais antigo.
              for release in releases:
                  if release.get("tag_name") == tag or release.get("draft"):
                      continue
                  for asset in release.get("assets", []):
                      if asset.get("name") != "latest-desktop.json":
                          continue
                      # Herdado ou novo, o manifesto sai nos dois nomes.
                      with urlopen(asset["browser_download_url"], timeout=30) as corpo:
                          anterior = json.load(corpo)
                      print(
                          "Build sem artefatos: herdando o manifesto "
                          f"{anterior.get('version')} de {release.get('tag_name')}."
                      )
                      return anterior
              raise SystemExit(
                  "Os artefatos desta tag nao existem e nenhum release anterior "
                  "traz um latest-desktop.json para herdar. Refaca o build."
              )

          faltando = [nome for nome in names.values() if not (assets / nome).is_file()]
          if faltando:
              print("Artefatos ausentes: " + ", ".join(faltando))
              manifest = herdado()
              # A tag e a data sao DESTE release: o manifesto vive nele. Só os
              # pacotes, e a versao que eles entregam, e que sao herdados.
              manifest["inherited_from"] = manifest.get("release_url", "")
              manifest["tag"] = tag
              manifest["published_at"] = datetime.now(timezone.utc).isoformat()
              manifest["release_url"] = (
                  f"https://github.com/{repository}/releases/tag/{tag}"
              )
          else:
              manifest = {
                  "schema_version": 1,
                  "version": version,
                  "tag": tag,
                  "published_at": datetime.now(timezone.utc).isoformat(),
                  "commit": os.environ["GITHUB_SHA"],
                  "release_url": f"https://github.com/{repository}/releases/tag/{tag}",
                  "platforms": {
                      "windows": {
                          "packages": [
                              package("windows_installer", "installer", "exe", True),
                              package("windows_zip", "portable", "zip", False),
                          ]
                      },
                      "linux": {
                          "packages": [
                              package("linux_zip", "portable", "zip", True),
                          ]
                      },
                  },
              }
          # `latest-desktop.json`, e NUNCA `latest.json`.
          #
          # As duas linhagens do PDV convivem: a 1.8.x (offline, pasta
          # `flutter/` das outras branches) publica e consome `latest.json`.
          # Escrever esse nome aqui faria o PDV ANTIGO enxergar a 3.0.0 como
          # atualizacao, baixar um ZIP cujo executavel tem outro nome e ou
          # recusa-lo a cada verificacao, ou aplica-lo — trocando um PDV que
          # vende sem internet por um que nao vende.
          #
          # O nome tambem precisa bater com o que o app desta linhagem pede em
          # `pdv_desktop/lib/core/update/pdv_update_service.dart`: o asset do
          # Release E a URL, entao um nome diferente aqui e um 404 la.
          corpo = json.dumps(manifest, ensure_ascii=False, indent=2) + "\n"
          (assets / "latest-desktop.json").write_text(corpo, encoding="utf-8")

          # `latest.json` é o nome que a linhagem 1.8.x consome, e publicá-lo
          # aqui é o que FAZ os terminais antigos migrarem para esta versão.
          #
          # Isto era proibido de propósito enquanto a 1.8.x estava em produção:
          # ela vende sem internet e a 3.x não, então a migração automática
          # trocaria um PDV que opera offline por um que não opera. A proibição
          # caiu quando a 1.8.x saiu de produção. Se algum dia uma instalação
          # offline voltar a existir, o caminho é parar de escrever este arquivo
          # — não mexer no conteúdo dele.
          #
          # O conteúdo é o MESMO: os dois atualizadores leem `schema_version: 1`
          # e escolhem o pacote por `kind: portable` + `format: zip`. O que a
          # 1.8.x exige a mais é o executável `starchef_pdv.exe` dentro do ZIP,
          # garantido no passo de empacotamento do Windows.
          (assets / "latest.json").write_text(corpo, encoding="utf-8")

      - name: Guardar pacote completo do release no Actions
        uses: actions/upload-artifact@v4
        with:
          name: starchef-pdv-release-${{ needs.release-metadata.outputs.version }}
          path: release-assets/*
          # `warn`, nao `error`: num build que falhou a pasta traz so o
          # manifesto herdado, e reprovar aqui apagaria justamente a publicacao
          # que existe para impedir o 404 em campo.
          if-no-files-found: warn

      - name: Publicar GitHub Release
        # `@v3`, nao `@v2`: a v2 declara `using: node20`, e o GitHub passou a
        # rodar essas actions no Node 24 (o node20 esta em depreciacao). Sob o
        # runtime novo a v2 falha ao montar o diretorio temporario dos assets —
        # "Error creating asset temp dir" — DEPOIS de ja ter criado o Release,
        # entao a tag sai com um release vazio. Foi o que aconteceu na v3.0.1.
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-assets/*
