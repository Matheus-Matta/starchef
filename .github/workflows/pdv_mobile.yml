name: pdv-mobile

# Tudo do atendimento móvel mora aqui: analyze, testes, APK e a publicação.
#
# O workflow é INDEPENDENTE do PDV desktop. Antes ele era chamado por
# `pdv_desktop.yml` (`workflow_call`) durante o release — o que significava que
# uma mudança só no Android passava pelo pipeline do instalador do Windows, e
# que o APK só saía se o job do desktop chegasse até ele.
#
# Agora os dois reagem à MESMA tag `vX.Y.Z`, cada um por conta própria, e os
# dois anexam ao MESMO GitHub Release. O que os coordena é o `concurrency` do
# job de publicação: os dois usam o mesmo grupo, então nunca mexem no Release
# ao mesmo tempo. Quem chegar primeiro cria; o outro anexa.
#
# Cada produto tem manifesto próprio: o PDV publica `latest-desktop.json` e o
# atendimento móvel publica `latest-mobile.json`. Nenhum dos dois precisa saber
# da versão do outro.

on:
  pull_request:
    paths:
      - "pdv_mobile/**"
      - ".github/workflows/pdv_mobile.yml"
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "pdv_mobile/**"
      - ".github/workflows/pdv_mobile.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: pdv_mobile

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Instalar dependências
        run: flutter pub get

      - name: Tamanho de arquivo (catraca de 200 linhas)
        working-directory: ${{ github.workspace }}
        run: python3 scripts/check_tamanho_de_arquivo.py
      - name: Analyze
        run: flutter analyze

      - name: Testes
        run: flutter test

  # A versão e a decisão de reconstruir, sem depender do workflow do desktop.
  #
  # O APK universal passa de 69 MB. Republicar um arquivo idêntico a cada tag
  # do PDV enche o Release de peso morto e ainda faz o aparelho do garçom
  # baixar de novo o que já tem — por isso a conta é por ARQUIVO ALTERADO, não
  # pela versão declarada: esquecer de subir o `version:` do pubspec faria uma
  # correção não ser publicada em silêncio, falha bem pior do que um build a
  # mais.
  release-metadata:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.mudou.outputs.changed }}
      should_build: ${{ steps.mudou.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          # O histórico inteiro: o passo abaixo compara esta tag com a
          # anterior, e o clone raso do padrão não tem tag anterior.
          fetch-depth: 0

      - name: Resolver a versão do APK
        id: version
        shell: bash
        run: |
          set -euo pipefail
          full="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          version="${full%%+*}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versão inválida em pdv_mobile/pubspec.yaml: $full" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice::Atendimento móvel $version"

      # A tag anterior é achada pelo NOME (a mais recente que não seja esta), e
      # não por `git describe` a partir do commit pai: refazer uma tag (apagar
      # e recriar sobre outro commit, como a v1.7.2 e a v1.8.1 já precisaram)
      # muda o ref sem mudar o grafo de commits, e `describe` podia encontrar a
      # própria tag recém-apagada como "anterior" — o diff contra ela mesma
      # dava vazio, e o APK ficava reaproveitado mesmo tendo mudado de verdade.
      - name: Decidir se o APK precisa ser reconstruído
        id: mudou
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          MANIFEST_URL: ${{ vars.PDV_MOBILE_MANIFEST_URL || format('https://github.com/{0}/releases/latest/download/latest-mobile.json', github.repository) }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            # Fora de uma tag o APK sempre é compilado: é o pacote de
            # homologação que quem abriu o PR vai instalar para testar.
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous="$(git tag --list 'v*.*.*' --sort=-v:refname | grep -vFx "$GITHUB_REF_NAME" | head -n1 || true)"
          if [[ -z "$previous" ]]; then
            changed=true
            motivo="não há release anterior para comparar"
          elif ! git diff --quiet "$previous" "$GITHUB_SHA" --                 pdv_mobile .github/workflows/pdv_mobile.yml; then
            changed=true
            motivo="pdv_mobile mudou desde $previous"
          elif ! curl -fsSL --max-time 30 "$MANIFEST_URL"                 | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("package",{}).get("url") else 1)'; then
            # Sem um APK reaproveitável no manifesto anterior não há o que
            # herdar: o app ficaria sem para onde apontar.
            changed=true
            motivo="o manifesto anterior não traz um APK reaproveitável"
          else
            changed=false
            motivo="nada mudou em pdv_mobile desde $previous"
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "should_build=$changed" >> "$GITHUB_OUTPUT"
          if [[ "$changed" == "true" ]]; then
            echo "::notice::APK será reconstruído ($motivo)."
          else
            echo "::notice::APK reaproveitado do release anterior ($motivo)."
          fi

  build-apk:
    needs: release-metadata
    if: needs.release-metadata.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    env:
      # Os quatro `GARCOM_*` continuam com o nome antigo de proposito: eles sao
      # Secrets do repositorio, cadastrados em Settings -> Secrets, e o nome
      # mora la — nao aqui. Renomear neste arquivo faria eles pararem de
      # resolver, e o APK de release sairia assinado com a chave de debug.
      GARCOM_KEYSTORE_BASE64: ${{ secrets.GARCOM_KEYSTORE_BASE64 }}
      GARCOM_KEYSTORE_PASSWORD: ${{ secrets.GARCOM_KEYSTORE_PASSWORD }}
      GARCOM_KEY_ALIAS: ${{ secrets.GARCOM_KEY_ALIAS }}
      GARCOM_KEY_PASSWORD: ${{ secrets.GARCOM_KEY_PASSWORD }}
      # Numa tag a assinatura é obrigatória; em PR e disparo manual, não.
      REQUIRE_SIGNING: ${{ github.ref_type == 'tag' && 'true' || 'false' }}
      MOBILE_VERSION: ${{ needs.release-metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Instalar dependências
        run: flutter pub get

      - name: Configurar assinatura do APK
        shell: bash
        run: |
          set -euo pipefail
          present=0
          for value in "${GARCOM_KEYSTORE_BASE64:-}" \
                       "${GARCOM_KEYSTORE_PASSWORD:-}" \
                       "${GARCOM_KEY_ALIAS:-}" \
                       "${GARCOM_KEY_PASSWORD:-}"; do
            if [[ -n "$value" ]]; then present=$((present + 1)); fi
          done
          if [[ "$present" -ne 0 && "$present" -ne 4 ]]; then
            echo "Configure os QUATRO Secrets GARCOM_*; a configuração está incompleta." >&2
            exit 1
          fi
          if [[ "$present" -eq 0 ]]; then
            # Numa tag isto é fatal: um APK com a chave de debug NÃO instala
            # por cima do app já instalado no aparelho do garçom (o Android
            # exige assinatura idêntica), então a atualização automática
            # morreria em silêncio no aparelho de cada um.
            if [[ "$REQUIRE_SIGNING" == "true" ]]; then
              echo "::error::Secrets GARCOM_* ausentes. Um release NÃO pode sair com a chave de debug: o APK não instalaria por cima do app já instalado. Cadastre GARCOM_KEYSTORE_BASE64, GARCOM_KEYSTORE_PASSWORD, GARCOM_KEY_ALIAS e GARCOM_KEY_PASSWORD."
              exit 1
            fi
            echo "::warning::Secrets GARCOM_* ausentes: APK de homologação assinado com a chave de debug. Serve para instalar em aparelho limpo, não para atualizar."
            exit 0
          fi
          printf '%s' "$GARCOM_KEYSTORE_BASE64" | base64 --decode > android/starchef-pdv-mobile-release.jks
          {
            printf 'storeFile=starchef-pdv-mobile-release.jks\n'
            printf 'storePassword=%s\n' "$GARCOM_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$GARCOM_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$GARCOM_KEY_PASSWORD"
          } > android/key.properties

      # Dois builds, e os dois são usados.
      #
      # O universal carrega o código nativo das três arquiteturas e passa de
      # 69 MB; o de uma arquitetura só fica em torno de 25 MB. A atualização
      # automática baixa o da arquitetura do aparelho — dois terços a menos de
      # Wi-Fi da loja por celular, a cada versão. O universal continua sendo
      # publicado porque é o que se instala à mão em qualquer aparelho sem
      # pensar, e é ele que as versões antigas do app (que só conhecem
      # `package`) continuam baixando.
      - name: Build dos APKs
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --split-per-abi
          flutter build apk --release
          out="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$out"
          apks=build/app/outputs/flutter-apk
          cp "$apks/app-release.apk" "$out/StarChef-PDV-Mobile-v${MOBILE_VERSION}.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            nome="StarChef-PDV-Mobile-v${MOBILE_VERSION}-$abi.apk"
            cp "$apks/app-$abi-release.apk" "$out/$nome"
          done
          ls -la "$out"

      # Quem assinou, dito em voz alta. Antes o único sinal era a AUSÊNCIA de
      # um aviso amarelo — fácil de não notar, e impossível de conferir depois
      # que o run rolou a tela. Aqui a impressão digital aparece no log, e a
      # chave de debug é recusada explicitamente em release.
      - name: Conferir quem assinou o APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$GITHUB_WORKSPACE/artifacts/StarChef-PDV-Mobile-v${MOBILE_VERSION}.apk"
          apksigner="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" \
            -name apksigner -type f 2>/dev/null | sort -r | head -n1 || true)"
          if [[ -n "$apksigner" ]]; then
            certs="$("$apksigner" verify --print-certs "$apk")"
          else
            # Sem o SDK à mão o keytool lê a assinatura v1 (JAR), que o build
            # do Flutter ainda inclui junto da v2.
            certs="$(keytool -printcert -jarfile "$apk")"
          fi
          echo "$certs"
          owner="$(printf '%s' "$certs" | grep -iE 'DN:|Propriet|Owner' | head -n1 || true)"
          sha="$(printf '%s' "$certs" | grep -iE 'SHA-?256 digest|SHA256:' | head -n1 || true)"
          {
            printf '### Assinatura do APK\n\n'
            printf '```\n%s\n%s\n```\n' "$owner" "$sha"
          } >> "$GITHUB_STEP_SUMMARY"
          if printf '%s' "$certs" | grep -qi 'CN=Android Debug'; then
            if [[ "$REQUIRE_SIGNING" == "true" ]]; then
              echo "::error::O APK saiu assinado com a chave de DEBUG do Android. Um release assim não atualiza nenhum aparelho que já tenha o app."
              exit 1
            fi
            echo "::warning::APK assinado com a chave de debug (build de homologação)."
          fi

      - name: Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: starchef-pdv-mobile-android-${{ needs.release-metadata.outputs.version }}
          path: artifacts/StarChef-PDV-Mobile-v*.apk
          if-no-files-found: error

  # Publicação. Anexa o APK ao GitHub Release da tag e escreve o
  # `latest-mobile.json` — o manifesto PRÓPRIO do atendimento móvel, separado do
  # `latest-desktop.json` do PDV.
  #
  # Roda em TODA tag, inclusive quando o APK não foi reconstruído. O motivo é
  # concreto: o app procura o manifesto em `releases/latest/download/`, e
  # `latest` passa a ser o release DESTA tag assim que ele existe. Se este job
  # fosse pulado, a URL passaria a responder 404 e o app pararia de conseguir
  # checar atualização — mesmo estando na versão certa. Então, quando não há APK
  # novo, o manifesto é reescrito herdando o pacote do release anterior, cuja
  # URL continua válida.
  publish-mobile:
    needs: [release-metadata, build-apk]
    # `always()` porque `build-apk` é PULADO quando o app não mudou — e um job
    # pulado em `needs` pularia este junto.
    if: >-
      always() && github.event_name == 'push' && github.ref_type == 'tag' &&
      needs.release-metadata.result == 'success' &&
      (needs.build-apk.result == 'success' || needs.build-apk.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # O PDV desktop publica no MESMO Release, a partir de outro workflow. Este
    # grupo é compartilhado com o `publish-release` de `pdv_desktop.yml`: os
    # dois nunca mexem no Release ao mesmo tempo, e quem chegar primeiro cria.
    # Sem isso, os dois podem tentar criar o mesmo release e um recebe 422.
    concurrency:
      group: gh-release-${{ github.ref_name }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: .
    env:
      MOBILE_VERSION: ${{ needs.release-metadata.outputs.version }}
      APK_RECONSTRUIDO: ${{ needs.build-apk.result == 'success' }}
      # De onde herdar o pacote quando o APK não foi reconstruído. Neste
      # instante `releases/latest` ainda aponta para o release ANTERIOR.
      MANIFEST_URL: ${{ vars.PDV_MOBILE_MANIFEST_URL || format('https://github.com/{0}/releases/latest/download/latest-mobile.json', github.repository) }}
    steps:
      - name: Baixar o APK deste release
        if: needs.build-apk.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: starchef-pdv-mobile-android-${{ needs.release-metadata.outputs.version }}
          path: release-assets

      - name: Gerar latest-mobile.json com SHA-256
        shell: python
        run: |
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import urlopen

          raiz = Path(os.environ["GITHUB_WORKSPACE"])
          assets = raiz / "release-assets"
          assets.mkdir(parents=True, exist_ok=True)
          versao = os.environ["MOBILE_VERSION"]
          tag = os.environ["GITHUB_REF_NAME"]
          repositorio = os.environ["GITHUB_REPOSITORY"]

          # As arquiteturas que o `--split-per-abi` do Flutter gera.
          ABIS = ("arm64-v8a", "armeabi-v7a", "x86_64")
          nomes = {"universal": f"StarChef-PDV-Mobile-v{versao}.apk"}
          for abi in ABIS:
              nomes[abi] = f"StarChef-PDV-Mobile-v{versao}-{abi}.apk"

          def pacote(chave, recomendado=True):
              nome = nomes[chave]
              caminho = assets / nome
              return {
                  "kind": "apk",
                  "format": "apk",
                  "name": nome,
                  "url": f"https://github.com/{repositorio}/releases/download/{tag}/{quote(nome)}",
                  "sha256": hashlib.sha256(caminho.read_bytes()).hexdigest(),
                  "size": caminho.stat().st_size,
                  "recommended": recomendado,
              }

          def corpo():
              """O APK deste release, ou o do anterior."""
              if (assets / nomes["universal"]).is_file():
                  # `package` é o universal, e continua sendo o único campo que
                  # as versões antigas do app conhecem: elas seguem atualizando
                  # por ele. `packages` é a lista por arquitetura, ~25 MB cada
                  # em vez dos ~69 MB do universal — o app novo escolhe a sua.
                  por_abi = [
                      {**pacote(abi), "abi": abi}
                      for abi in ABIS
                      if (assets / nomes[abi]).is_file()
                  ]
                  return {"version": versao, "package": pacote("universal"), "packages": por_abi}

              anterior = os.environ["MANIFEST_URL"]
              with urlopen(anterior, timeout=30) as resposta:
                  herdado = json.load(resposta)
              if not herdado.get("package", {}).get("url"):
                  raise SystemExit(
                      "APK ausente e o manifesto anterior não traz um para herdar. "
                      "Refaça o release com o APK reconstruído."
                  )
              print(f"Reaproveitando o APK {herdado.get('version')} do release anterior.")
              return {
                  "version": herdado.get("version", versao),
                  "package": herdado["package"],
                  "packages": herdado.get("packages", []),
              }

          manifesto = {
              "schema_version": 1,
              "tag": tag,
              "published_at": datetime.now(timezone.utc).isoformat(),
              "commit": os.environ["GITHUB_SHA"],
              "release_url": f"https://github.com/{repositorio}/releases/tag/{tag}",
              **corpo(),
          }
          (assets / "latest-mobile.json").write_text(
              json.dumps(manifesto, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(manifesto, ensure_ascii=False, indent=2))

      - name: Anexar ao GitHub Release da tag
        # `@v3`, nao `@v2`: a v2 declara `using: node20`, e o GitHub passou a
        # rodar essas actions no Node 24 (o node20 esta em depreciacao). Sob o
        # runtime novo a v2 falha ao montar o diretorio temporario dos assets —
        # "Error creating asset temp dir" — DEPOIS de ja ter criado o Release,
        # entao a tag sai com um release vazio. Foi o que aconteceu na v3.0.1.
        uses: softprops/action-gh-release@v3
        with:
          # O PDV desktop anexa os pacotes dele ao MESMO release. A action
          # cria o release se ainda não existir e o atualiza se existir, então
          # a ordem entre os dois workflows não importa.
          files: release-assets/*
