name: backend

on:
  push:
    branches: [main]
    # Tag de release (ex.: v1.4.0) — numa criação de tag o GitHub não tem um
    # "before" sha significativo pra comparar, então o `paths:` abaixo não
    # filtra nada: toda tag de release builda a imagem, ponto de corte oficial.
    tags: ["v*.*.*"]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/development.txt

      - name: Instalar dependências
        run: pip install -r requirements/development.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Checar migrations pendentes
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python manage.py makemigrations --check --dry-run

      - name: Testes (pytest + coverage)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: pytest --cov=apps --cov-report=term-missing

  # Só roda em push na main (nunca em PR) e só depois do job `test` passar.
  # Combinado com o `paths:` do gatilho acima, a imagem só é gerada quando
  # backend/** muda — sem imagem nova por alteração em frontend/ ou flutter/.
  build-and-push-image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` é sempre a tag atual: em push na main (edge) ou em QUALQUER
      # tag vX.Y.Z (release) — sem depender de comparação semver, a tag que
      # acabou de ser processada é sempre a mais atual.
      - name: Metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/starchef-backend
          flavor: |
            latest=false
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      # Sem secrets no build: settings de produção (DB, Redis, chaves) são
      # lidos em runtime pelo container via .env.production (docker-compose.prod.yml).
      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: backend
          build-args: |
            REQUIREMENTS=production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Poda o GHCR: mantém as 10 versões com tag mais recentes (as sha-* de
  # commits antigos viram lixo a cada push) e nunca apaga `latest` nem
  # versões semver (release) — essas ficam protegidas por `exclude-tags`
  # independente de idade/posição no ranking.
  cleanup-old-images:
    needs: build-and-push-image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: starchef-backend
          keep-n-tagged: 10
          exclude-tags: "latest,*.*"
          delete-untagged: true
