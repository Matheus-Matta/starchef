name: backend

on:
  push:
    branches: [main]
    # Tag de release (ex.: v1.4.0) — numa criação de tag o GitHub não tem um
    # "before" sha significativo pra comparar, então o `paths:` abaixo não
    # filtra nada: toda tag de release builda a imagem, ponto de corte oficial.
    tags: ["v*.*.*"]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/development.txt

      - name: Instalar dependências
        run: pip install -r requirements/development.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Checar migrations pendentes
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python manage.py makemigrations --check --dry-run

      - name: Testes (pytest + coverage)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: pytest --cov=apps --cov-report=term-missing

  # Só roda em tag vX.Y.Z (nunca em push direto na main nem em PR) e só depois
  # do job `test` passar. Commit direto na main nunca gera imagem — só a tag
  # de release builda e publica, pra backend/frontend/flutter saírem sempre
  # com a MESMA versão sem duplicar build a cada commit.
  build-and-push-image:
    needs: test
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Esse job só roda em tag, então `latest` sempre acompanha a tag atual
      # sem precisar de condição extra.
      - name: Metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/starchef-backend
          flavor: |
            latest=false
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # Sem secrets no build: settings de produção (DB, Redis, chaves) são
      # lidos em runtime pelo container via .env (docker-compose.yml).
      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: backend
          build-args: |
            REQUIREMENTS=production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Poda o GHCR por idade: qualquer versão (tag ou sem tag) com mais de 1 ano
  # vira lixo e é apagada, MENOS a que estiver com a tag `latest` no momento —
  # essa fica protegida sempre, não importa a idade.
  cleanup-old-images:
    needs: build-and-push-image
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: starchef-backend
          older-than: 1 year
          exclude-tags: latest
          delete-untagged: true
