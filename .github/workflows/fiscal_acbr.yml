name: fiscal-acbr

# O comunicador ACBrLib (fiscal_acbr/, docs/FISCAL_ACBRLIB.md). Mesmo desenho
# do backend.yml: testa em PR, publica imagem só em tag vX.Y.Z e só reconstrói
# quando fiscal_acbr/ mudou desde a tag anterior — senão re-etiqueta.
#
# Gera a imagem `ghcr.io/<dono>/starchef-fiscal-acbr` no nosso GHCR:
#
# * tag vX.Y.Z: publica `X.Y.Z`, `X.Y` e `latest` (o compose da loja usa a
#   versão; o da nuvem, `latest`);
# * botão "Run workflow" (workflow_dispatch): gera na hora, SEM tag, com as
#   etiquetas `manual` e `sha-<commit>` — nunca mexe no `latest` nem na versão
#   que as lojas usam.
#
# A libacbrnfe64.so (Projeto ACBr, licença própria) não é versionada. Com o
# Secret `ACBRLIB_SO_URL` (e, recomendado, a Variable `ACBRLIB_SO_SHA256`), a
# Action a baixa, confere o SHA-256 e a EMBUTE em /opt/acbr: a loja deixa de
# copiar o arquivo à mão. Sem o Secret, a imagem sai sem a lib e cada
# instalação monta a sua em /app/libs — que, existindo, tem precedência.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "fiscal_acbr/**"
      - ".github/workflows/fiscal_acbr.yml"
  pull_request:
    paths:
      - "fiscal_acbr/**"
      - ".github/workflows/fiscal_acbr.yml"

defaults:
  run:
    working-directory: fiscal_acbr

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt httpx pytest

      # Com a SEFAZ simulada (tests/conftest.py liga ACBR_SIMULADOR=1): a lib de
      # verdade e o certificado só existem na homologação.
      - name: Testes
        run: pytest tests

  build-and-push-image:
    needs: test
    if: (github.event_name == 'push' && github.ref_type == 'tag') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Igual ao backend.yml, inclusive no cuidado que custou caro lá: a tag
      # anterior é achada pelo NOME, e o diff roda na RAIZ do repo. Com o
      # working-directory padrão (fiscal_acbr/) o pathspec viraria
      # `fiscal_acbr/fiscal_acbr`, o diff sairia sempre vazio e a imagem nunca
      # seria reconstruída.
      # Antes do "decidir": com a lib embutida a imagem é SEMPRE reconstruída
      # — a .so pode ter mudado sem nenhum arquivo do repositório mudar.
      - name: Embutir a libacbrnfe64.so (opcional)
        id: lib
        shell: bash
        env:
          ACBRLIB_SO_URL: ${{ secrets.ACBRLIB_SO_URL }}
          ACBRLIB_SO_SHA256: ${{ vars.ACBRLIB_SO_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "${ACBRLIB_SO_URL:-}" ]]; then
            echo "embutida=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sem o Secret ACBRLIB_SO_URL: imagem sem a lib (cada instalação monta a sua em /app/libs)."
            exit 0
          fi
          curl -fsSL --retry 3 -o embutida/libacbrnfe64.so "$ACBRLIB_SO_URL"
          if [[ -n "${ACBRLIB_SO_SHA256:-}" ]]; then
            echo "${ACBRLIB_SO_SHA256}  embutida/libacbrnfe64.so" | sha256sum -c -
          else
            echo "::warning::Sem a Variable ACBRLIB_SO_SHA256: a lib baixada não foi conferida."
          fi
          # Uma .so de verdade começa com o cabeçalho ELF; uma página de erro
          # HTML baixada no lugar dela não começa.
          [[ "$(head -c 4 embutida/libacbrnfe64.so | od -An -tx1 | tr -d ' \n')" == "7f454c46" ]] || { echo "::error::O arquivo baixado não é uma .so (cabeçalho ELF ausente)."; exit 1; }
          echo "embutida=true" >> "$GITHUB_OUTPUT"
          echo "::notice::libacbrnfe64.so embutida ($(sha256sum embutida/libacbrnfe64.so | cut -c1-16)...)."

      - name: Decidir se a imagem precisa ser reconstruida
        id: changed
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          EMBUTIDA: ${{ steps.lib.outputs.embutida }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$EMBUTIDA" == "true" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous="$(git tag --list 'v*.*.*' --sort=-v:refname | grep -vFx "$GITHUB_REF_NAME" | head -n1 || true)"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/starchef-fiscal-acbr"
          if [[ -z "$previous" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif ! docker manifest inspect "$image:latest" >/dev/null 2>&1; then
            # Primeira publicação: não há imagem para re-etiquetar.
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Ainda não há imagem publicada: será construída."
          elif git diff --quiet "$previous" "$GITHUB_SHA" -- fiscal_acbr .github/workflows/fiscal_acbr.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nada mudou em fiscal_acbr/ desde $previous: a imagem será re-etiquetada."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::fiscal_acbr/ mudou desde $previous: imagem será reconstruída."
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/starchef-fiscal-acbr
          flavor: |
            latest=false
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=manual,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build e push
        if: steps.changed.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: fiscal_acbr
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Re-etiquetar a imagem existente
        if: steps.changed.outputs.changed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/starchef-fiscal-acbr"
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create --tag "$image:$version" --tag "$image:${version%.*}" "$image:latest"
