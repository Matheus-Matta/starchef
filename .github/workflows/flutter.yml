name: flutter

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "flutter/**"
      - ".github/workflows/flutter.yml"
      - ".github/workflows/garcom.yml"
  pull_request:
    paths:
      - "flutter/**"
      - ".github/workflows/flutter.yml"
      - ".github/workflows/garcom.yml"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API_BASE_URL do build (vazio = variável PDV_API_BASE_URL)"
        required: false
        type: string
      sentry_dsn:
        description: "PDV_SENTRY_DSN do build (vazio = secret PDV_SENTRY_DSN)"
        required: false
        type: string
      update_manifest_url:
        description: "URL do latest.json (vazio = GitHub Releases deste repositório)"
        required: false
        type: string

defaults:
  run:
    working-directory: flutter

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Instalar dependências
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # `flutter test` roda em windows-latest, o runner hospedado mais lento
      # do GitHub Actions, e alguns testes fazem I/O real de disco (SQLite
      # temporário) sob timers reais — com a suíte inteira disputando disco em
      # paralelo, um pico de contenção pontual pode estourar até uma folga
      # generosa. Uma repetição automática absorve essa flakiness transitória
      # sem esconder regressão de verdade: uma falha real reproduz nas duas
      # tentativas e continua barrando o release.
      - name: Testes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $maxAttempts = 2
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            flutter test
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt $maxAttempts) {
              Write-Host "::warning::flutter test falhou na tentativa $attempt/$maxAttempts — tentando novamente (possível flakiness de I/O no runner Windows)."
              Start-Sleep -Seconds 5
            }
          }
          exit $LASTEXITCODE

  # O pubspec é a fonte da versão do binário e a tag é a fonte da versão do
  # release. O pipeline para antes do build se os dois valores divergirem.
  release-metadata:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      garcom_version: ${{ steps.version.outputs.garcom_version }}
      garcom_changed: ${{ steps.garcom.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # O histórico inteiro: o passo abaixo compara esta tag com a
          # anterior, e com o clone raso do padrão não existe tag anterior
          # para comparar.
          fetch-depth: 0

      - name: Conferir tag x versão do pubspec.yaml
        id: version
        shell: bash
        run: |
          set -euo pipefail
          full_version="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          version="${full_version%%+*}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versão inválida no pubspec.yaml: $full_version" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
              echo "Tag ${GITHUB_REF_NAME} não bate com pubspec.yaml (${version})." >&2
              exit 1
            fi
          fi
          garcom_full_version="$(awk '/^version:/{print $2; exit}' ../flutter_garcom/pubspec.yaml)"
          garcom_version="${garcom_full_version%%+*}"
          if [[ ! "$garcom_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versão inválida no flutter_garcom/pubspec.yaml: $garcom_full_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "garcom_version=$garcom_version" >> "$GITHUB_OUTPUT"

      # O APK só é recompilado quando o aplicativo do garçom mudou de verdade
      # desde o release anterior. Um APK universal pesa ~72 MB; republicar um
      # arquivo idêntico a cada tag do PDV enche o Release de peso morto e
      # ainda faz o aparelho do garçom baixar de novo o que já tem.
      #
      # A conta é por ARQUIVO ALTERADO, não pela versão declarada: esquecer de
      # subir o `version:` do pubspec faria a correção não ser publicada, em
      # silêncio — falha muito pior do que um build a mais.
      - name: Decidir se o APK do garçom precisa ser reconstruído
        id: garcom
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          MANIFEST_URL: ${{ vars.PDV_UPDATE_MANIFEST_URL || format('https://github.com/{0}/releases/latest/download/latest.json', github.repository) }}
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 --match 'v*.*.*'             "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [[ -z "$previous" ]]; then
            changed=true
            reason="não há release anterior para comparar"
          elif ! git diff --quiet "$previous" "$GITHUB_SHA" --               flutter_garcom .github/workflows/garcom.yml; then
            changed=true
            reason="flutter_garcom mudou desde $previous"
          elif ! curl -fsSL --max-time 30 "$MANIFEST_URL"               | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("garcom",{}).get("package",{}).get("url") else 1)'; then
            # Sem um APK reaproveitável no manifesto anterior não há o que
            # herdar: o app ficaria sem para onde apontar.
            changed=true
            reason="o manifesto anterior não traz um APK reaproveitável"
          else
            changed=false
            reason="nada mudou em flutter_garcom desde $previous"
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [[ "$changed" == "true" ]]; then
            echo "::notice::APK do garçom será reconstruído ($reason)."
          else
            echo "::notice::APK do garçom reaproveitado do release anterior ($reason)."
          fi

  build-windows:
    needs: release-metadata
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: windows-latest
    env:
      API_BASE_URL: ${{ inputs.api_base_url || vars.PDV_API_BASE_URL }}
      PDV_SENTRY_DSN: ${{ inputs.sentry_dsn || secrets.PDV_SENTRY_DSN }}
      CUSTOM_UPDATE_MANIFEST_URL: ${{ inputs.update_manifest_url || vars.PDV_UPDATE_MANIFEST_URL }}
      APP_VERSION: ${{ needs.release-metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Instalar dependências
        run: flutter pub get

      - name: Build Windows (release)
        shell: pwsh
        run: |
          if (-not $env:API_BASE_URL) {
            throw "API_BASE_URL não definido. Configure PDV_API_BASE_URL ou informe api_base_url."
          }
          $manifestUrl = $env:CUSTOM_UPDATE_MANIFEST_URL
          if (-not $manifestUrl) {
            $manifestUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/latest.json"
          }
          $defines = @(
            "--dart-define=API_BASE_URL=$env:API_BASE_URL",
            "--dart-define=PDV_UPDATE_MANIFEST_URL=$manifestUrl"
          )
          if ($env:PDV_SENTRY_DSN) {
            $defines += "--dart-define=PDV_SENTRY_DSN=$env:PDV_SENTRY_DSN"
          }
          flutter build windows --release @defines
          if ($LASTEXITCODE -ne 0) {
            throw "flutter build windows falhou com código $LASTEXITCODE"
          }

      - name: Gerar instalador (Inno Setup)
        shell: pwsh
        run: .\windows\installer\build_installer.ps1

      - name: Gerar ZIP portátil do Windows
        shell: pwsh
        run: |
          $output = "..\artifacts\StarChef-PDV-Windows-v$env:APP_VERSION.zip"
          Compress-Archive -Path ".\build\windows\x64\runner\Release\*" -DestinationPath $output -Force

      - name: Upload dos pacotes Windows
        uses: actions/upload-artifact@v4
        with:
          name: starchef-pdv-windows-${{ needs.release-metadata.outputs.version }}
          path: |
            artifacts/StarChef-PDV-Setup-*.exe
            artifacts/StarChef-PDV-Windows-v*.zip
          if-no-files-found: error

  build-linux:
    needs: release-metadata
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ inputs.api_base_url || vars.PDV_API_BASE_URL }}
      PDV_SENTRY_DSN: ${{ inputs.sentry_dsn || secrets.PDV_SENTRY_DSN }}
      CUSTOM_UPDATE_MANIFEST_URL: ${{ inputs.update_manifest_url || vars.PDV_UPDATE_MANIFEST_URL }}
      APP_VERSION: ${{ needs.release-metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar bibliotecas do Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev libcurl4-openssl-dev zip

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Instalar dependências
        run: flutter pub get

      - name: Build Linux (release)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${API_BASE_URL:-}" ]]; then
            echo "API_BASE_URL não definido. Configure PDV_API_BASE_URL ou informe api_base_url." >&2
            exit 1
          fi
          manifest_url="${CUSTOM_UPDATE_MANIFEST_URL:-}"
          if [[ -z "$manifest_url" ]]; then
            manifest_url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json"
          fi
          defines=(
            "--dart-define=API_BASE_URL=${API_BASE_URL}"
            "--dart-define=PDV_UPDATE_MANIFEST_URL=${manifest_url}"
          )
          if [[ -n "${PDV_SENTRY_DSN:-}" ]]; then
            defines+=("--dart-define=PDV_SENTRY_DSN=${PDV_SENTRY_DSN}")
          fi
          flutter config --enable-linux-desktop
          flutter build linux --release "${defines[@]}"

      - name: Gerar ZIP do Linux
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../artifacts
          cd build/linux/x64/release/bundle
          zip -r "$GITHUB_WORKSPACE/artifacts/StarChef-PDV-Linux-v${APP_VERSION}.zip" .

      - name: Upload do pacote Linux
        uses: actions/upload-artifact@v4
        with:
          name: starchef-pdv-linux-${{ needs.release-metadata.outputs.version }}
          path: artifacts/StarChef-PDV-Linux-v*.zip
          if-no-files-found: error

  # O aplicativo do garçom tem workflow próprio (`garcom.yml`); aqui ele é
  # apenas CHAMADO, para o APK sair no mesmo run e poder ser anexado ao mesmo
  # Release. `require_signing` é o que impede um release de sair com a chave de
  # debug: assinado assim, o APK não instala por cima do app já instalado.
  garcom:
    needs: release-metadata
    if: >-
      needs.release-metadata.outputs.garcom_changed == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref_type == 'tag'))
    uses: ./.github/workflows/garcom.yml
    with:
      version: ${{ needs.release-metadata.outputs.garcom_version }}
      require_signing: ${{ github.ref_type == 'tag' }}
    secrets: inherit

  # Um único job reúne os três pacotes do PDV e o APK, calcula os hashes e
  # publica o manifesto junto do Release. O `latest.json` carrega o PDV em
  # `platforms` e o app do garçom na chave `garcom` — este último com
  # versionamento próprio, por isso fora de `platforms`.
  publish-release:
    # `always()` porque o job do garçom é PULADO quando o app não mudou desde
    # o release anterior; sem isso, um job pulado em `needs` pularia o publish
    # junto e o release inteiro não sairia. Os builds do PDV continuam
    # obrigatórios.
    needs: [release-metadata, build-windows, build-linux, garcom]
    if: >-
      always() && github.event_name == 'push' && github.ref_type == 'tag' &&
      needs.build-windows.result == 'success' &&
      needs.build-linux.result == 'success' &&
      (needs.garcom.result == 'success' || needs.garcom.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ needs.release-metadata.outputs.version }}
      GARCOM_VERSION: ${{ needs.release-metadata.outputs.garcom_version }}
      # De onde herdar o APK quando ele nao foi reconstruido neste release.
      # Neste instante `releases/latest` ainda aponta para o release ANTERIOR:
      # o desta tag so e criado no ultimo passo deste job.
      MANIFEST_URL: ${{ vars.PDV_UPDATE_MANIFEST_URL || format('https://github.com/{0}/releases/latest/download/latest.json', github.repository) }}
    steps:
      - name: Baixar pacotes dos builds
        uses: actions/download-artifact@v4
        with:
          pattern: starchef-pdv-*-${{ needs.release-metadata.outputs.version }}
          path: release-assets
          merge-multiple: true

      - name: Baixar APK do app do garçom
        if: needs.garcom.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: starchef-garcom-android-${{ needs.release-metadata.outputs.garcom_version }}
          path: release-assets

      - name: Gerar latest.json com SHA-256
        shell: python
        working-directory: .
        run: |
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import urlopen

          root = Path(os.environ["GITHUB_WORKSPACE"])
          assets = root / "release-assets"
          version = os.environ["APP_VERSION"]
          garcom_version = os.environ["GARCOM_VERSION"]
          tag = os.environ["GITHUB_REF_NAME"]
          repository = os.environ["GITHUB_REPOSITORY"]

          names = {
              "windows_installer": f"StarChef-PDV-Setup-{version}.exe",
              "windows_zip": f"StarChef-PDV-Windows-v{version}.zip",
              "linux_zip": f"StarChef-PDV-Linux-v{version}.zip",
              "garcom_apk": f"StarChef-Garcom-v{garcom_version}.apk",
          }
          # Os três do PDV são obrigatórios: o manifesto existe para servi-los.
          for key in ("windows_installer", "windows_zip", "linux_zip"):
              if not (assets / names[key]).is_file():
                  raise SystemExit(f"Artefato obrigatório ausente: {names[key]}")

          def package(key, kind, file_format, recommended):
              name = names[key]
              path = assets / name
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              return {
                  "kind": kind,
                  "format": file_format,
                  "name": name,
                  "url": f"https://github.com/{repository}/releases/download/{tag}/{quote(name)}",
                  "sha256": digest,
                  "size": path.stat().st_size,
                  "recommended": recommended,
              }

          # As arquiteturas que o `--split-per-abi` do Flutter gera.
          GARCOM_ABIS = ("arm64-v8a", "armeabi-v7a", "x86_64")
          for _abi in GARCOM_ABIS:
              names[f"garcom_{_abi}"] = (
                  f"StarChef-Garcom-v{garcom_version}-{_abi}.apk"
              )

          def garcom_block():
              """O APK deste release, ou o do release anterior.

              Quando `flutter_garcom/` nao muda entre duas tags, o APK nao e
              recompilado: republicar 72 MB identicos encheria o Release de
              peso morto e faria cada aparelho baixar de novo o que ja tem. O
              manifesto entao aponta para o APK do release ANTERIOR, cuja URL
              continua valida — o app compara versao, ve que ja esta nela e
              nao baixa nada.
              """
              if (assets / names["garcom_apk"]).is_file():
                  # `package` continua sendo o universal, e continua sendo o
                  # unico campo que as versoes antigas do app conhecem: elas
                  # seguem atualizando por ele. `packages` e a lista por
                  # arquitetura, ~25 MB cada em vez dos ~69 MB do universal —
                  # o app novo escolhe a sua e baixa um terco.
                  por_abi = [
                      {**package(f"garcom_{abi}", "apk", "apk", True), "abi": abi}
                      for abi in GARCOM_ABIS
                      if (assets / names[f"garcom_{abi}"]).is_file()
                  ]
                  return {
                      "version": garcom_version,
                      "package": package("garcom_apk", "apk", "apk", True),
                      "packages": por_abi,
                  }
              previous = os.environ["MANIFEST_URL"]
              with urlopen(previous, timeout=30) as response:
                  herdado = json.load(response).get("garcom")
              if not herdado or not herdado.get("package", {}).get("url"):
                  raise SystemExit(
                      "APK ausente e o manifesto anterior nao traz um para "
                      "herdar. Rode o release de novo com o job do garcom."
                  )
              print(f"Reaproveitando o APK {herdado['version']} do release anterior.")
              return herdado

          manifest = {
              "schema_version": 1,
              "version": version,
              "tag": tag,
              "published_at": datetime.now(timezone.utc).isoformat(),
              "commit": os.environ["GITHUB_SHA"],
              "release_url": f"https://github.com/{repository}/releases/tag/{tag}",
              "platforms": {
                  "windows": {
                      "packages": [
                          package("windows_installer", "installer", "exe", True),
                          package("windows_zip", "portable", "zip", False),
                      ]
                  },
                  "linux": {
                      "packages": [
                          package("linux_zip", "portable", "zip", True),
                      ]
                  },
              },
              # App do garcom: versionamento proprio (flutter_garcom/pubspec.yaml),
              # nao participa de "platforms" porque nao roda no PDV. O app
              # consulta esta chave direto pra saber se ha versao nova pra
              # baixar e instalar por cima da atual.
              "garcom": garcom_block(),
          }
          (assets / "latest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

      - name: Guardar pacote completo do release no Actions
        uses: actions/upload-artifact@v4
        with:
          name: starchef-pdv-release-${{ needs.release-metadata.outputs.version }}
          path: release-assets/*
          if-no-files-found: error

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
