; Configuração BASE da ACBrLib NFe. O que muda por emitente (UF, ambiente,
; modelo, certificado, CSC, forma de emissão) é gravado a cada chamada pelo
; comunicador (app/acbrlib.py) — aqui fica só o que é da instalação.
[Principal]
; 0 = respostas em INI, que o comunicador lê (app/ini.py)
TipoResposta=0
LogNivel=1
LogPath=/app/data/log

[DFe]
; OpenSSL (1) + libxml2 (4): o par que funciona no Linux
SSLCryptLib=1
SSLHttpLib=3
SSLXmlSignLib=4

[NFe]
Timeout=30000
SalvarGer=1
PathSalvar=/app/data/xml
; Os Schemas da NF-e (pasta Schemas/NFe da distribuição da ACBr), montados
; junto com a lib. Sem eles a validação do XML (NFE_Validar) recusa toda nota.
PathSchemas=/app/libs/Schemas
; O erro de schema por extenso: "falta a tag X", e não só "XML inválido".
ExibirErroSchema=1
; IniServicos vazio = a lista de endereços da SEFAZ embutida na lib (todas as
; UFs, homologação e produção). SSLType não é gravado: o padrão já é TLS 1.2,
; o que a SEFAZ exige. Conferido em ACBrDFeConfiguracoes.pas.
