[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:postgresql]
command=/usr/lib/postgresql/16/bin/postgres -D /var/lib/postgresql/16/main -c config_file=/etc/postgresql/16/main/postgresql.conf
user=postgres
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/postgres.log
stderr_logfile=/var/log/supervisor/postgres.err

[program:redis]
command=/usr/bin/redis-server
user=redis
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis.err

[program:gunicorn]
command=bash -c "source /app/.venv/bin/activate && cd /app/backend && gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker -b 127.0.0.1:8000"
user=appuser
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/gunicorn.log
stderr_logfile=/var/log/supervisor/gunicorn.err

[program:celery_worker]
command=bash -c "source /app/.venv/bin/activate && cd /app/backend && celery -A config worker -l info --concurrency=4"
user=appuser
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/celery_worker.log
stderr_logfile=/var/log/supervisor/celery_worker.err

[program:celery_beat]
command=bash -c "source /app/.venv/bin/activate && cd /app/backend && celery -A config beat -l info -s /tmp/celerybeat-schedule"
user=appuser
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/celery_beat.log
stderr_logfile=/var/log/supervisor/celery_beat.err

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx.err
