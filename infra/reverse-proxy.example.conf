# EXEMPLO DE REFERÊNCIA — não é consumido pelo docker-compose.yml deste
# repositório. O compose só publica frontend/backend em HTTP puro (loopback
# por padrão); TLS, rate limiting por IP e o proxy same-origin de /api, /ws,
# /static e /media são responsabilidade de um proxy reverso externo que você
# mesmo configura (nginx do host, Caddy, LB da nuvem etc.) — este arquivo é o
# ponto de partida. Ajuste `server_name`, os upstreams (abaixo) e os caminhos
# dos certificados conforme seu domínio/infra.
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;
    client_max_body_size 20m;

    # Confia no proxy para o IP real (atrás de load balancer/cloud, ajuste conforme).
    real_ip_header X-Forwarded-For;

    # ── Rate limiting por IP ────────────────────────────────────────────────
    # Zonas em memória (chave = IP). `api` protege a API geral; `login` é bem mais
    # rígido contra brute-force de credenciais. O DRF ainda tem o throttle por
    # usuário/rota — isto é a camada de borda (defesa em profundidade).
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=admin_login:10m rate=10r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # ── Compressão ──────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml application/wasm;
    gzip_static on;

    # Assume que este proxy roda no MESMO host que o docker compose, falando
    # com as portas publicadas em loopback (BACKEND_PORT/FRONTEND_PORT do
    # .env). Se este proxy for outro container na mesma rede `starchef`, troque
    # por `backend:8000` / `frontend:8080` (nomes dos serviços no compose).
    upstream backend {
        server 127.0.0.1:8000;
    }

    upstream frontend {
        server 127.0.0.1:8080;
    }

    # HTTP → HTTPS (mantém o desafio ACME/certbot acessível em texto claro).
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # Cabeçalhos de segurança (HSTS é redundante com o do Django, mas garante
        # cobertura mesmo em respostas servidas pelo próprio nginx).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # CSP same-origin: a SPA só chama a própria origem (API/WS same-origin,
        # ver vite.config.js) e não usa <script> inline (só type=module com src).
        # 'unsafe-inline' em style-src é necessário porque o PrimeVue injeta
        # estilos inline via JS (não dá pra restringir sem quebrar componentes).
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;

        # SPA: proxy pro container `frontend` (serve o build via `serve`, que já
        # aplica os Cache-Control corretos por caminho — ver frontend/serve.json).
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }

        # Estáticos (WhiteNoise) e media (fallback do Django) — ambos já
        # servidos pelo próprio backend, sem depender de volume compartilhado.
        location /static/ {
            access_log off;
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        location /media/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # Login/refresh: rate limit rígido contra brute-force.
        location ~ ^/api/v1/auth/(login|refresh|password-reset)/ {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API geral.
        location /api/ {
            limit_req zone=api burst=60 nodelay;
            limit_conn conn 20;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket (Channels): sem rate limit de request (conexão longa).
        # Este bloco tem que existir no server que atende a ORIGEM DA API — é
        # dela que o SPA deriva o wss:// (ver API_URL/WS_URL no .env.example).
        # Se a API estiver num subdomínio próprio (api.dominio), é o server
        # dele que precisa do /ws/, não o que serve o SPA.
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        location /health/ {
            access_log off;
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        location /admin/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /admin/login/ {
            limit_req zone=admin_login burst=5 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
