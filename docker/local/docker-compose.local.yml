# O StarChef INTEIRO dentro do restaurante, pronto para produção.
#
# São as MESMAS imagens da nuvem (backend e frontend), o mesmo código e as
# mesmas migrations. Nada é compilado na loja: o compose baixa as imagens da
# versão em `STARCHEF_VERSION` e sobe. O papel de "loja" é configuração
# (`SYNC_NODE_TYPE=local`), não build.
#
#   proxy        a PORTA ÚNICA da loja (http://IP-DO-SERVIDOR/)
#   frontend     a retaguarda web (o mesmo painel do app.starchef.com.br)
#   backend      a API que o PDV, o KDS e o app do garçom consomem
#   celery_worker tarefas do domínio + retry/reconciliação da sincronização
#   celery_beat  o relógio dessas tarefas periódicas
#   sync_worker  a conexão WSS com a nuvem (só faz algo com SYNC_ENABLED=true)
#   postgres     o banco da loja (a fonte da verdade local)
#   redis        cache, canal do Channels e broker do Celery
#
# A loja continua vendendo sem internet: o PDV fala com este servidor, e os
# eventos se acumulam na outbox até a nuvem voltar.
#
# Primeira vez: rode `instalar.ps1` (Windows) ou `instalar.sh` (Linux). Eles
# criam o `.env.local` com as senhas geradas e sobem tudo. À mão:
#   docker compose --env-file .env.local -f docker-compose.local.yml up -d
#
# Sem TLS de propósito: o acesso é pela rede interna do restaurante, e não há
# domínio público para emitir certificado. Restrinja a porta no firewall do
# host à faixa interna da loja.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Backend, workers e sync_worker compartilham a MESMA configuração. Repetir
# isso quatro vezes é como os quatro saem de sincronia sem ninguém perceber.
x-backend-base: &backend-base
  image: "${BACKEND_IMAGE:-ghcr.io/matheus-matta/starchef-backend:${STARCHEF_VERSION:?defina STARCHEF_VERSION no .env.local, por exemplo 3.0.62}}"
  restart: unless-stopped
  user: "1000:1000"
  logging: *default-logging
  env_file:
    - .env.local
  # `environment` ganha do `env_file`. O que está aqui é o que NÃO deve variar
  # de uma loja para outra, ou o que se deriva de outra variável — o cliente
  # edita só o `.env.local`, e um typo ali não desmonta a instalação.
  environment:
    DJANGO_ENV: production
    DJANGO_SETTINGS_MODULE: config.settings.production
    DJANGO_DEBUG: "False"
    USE_SQLITE_DATABASE: "False"
    USE_LOCAL_MEMORY_SERVICES: "False"
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-starchef_local}
    POSTGRES_USER: ${POSTGRES_USER:-starchef}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    # Tudo derivado de UMA variável, o endereço do servidor na rede da loja.
    # Antes eram três listas para manter iguais à mão; esquecer o IP numa delas
    # era "Bad Request (400)" no navegador sem pista nenhuma do motivo.
    DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend,proxy,${STORE_HOST:?STORE_HOST é obrigatório (IP ou nome do servidor na rede da loja)}"
    DJANGO_CORS_ALLOWED_ORIGINS: http://${STORE_HOST},http://${STORE_HOST}:${HTTP_PORT:-80},http://localhost,http://localhost:${HTTP_PORT:-80}
    DJANGO_CSRF_TRUSTED_ORIGINS: http://${STORE_HOST},http://${STORE_HOST}:${HTTP_PORT:-80},http://localhost,http://localhost:${HTTP_PORT:-80}
    # HTTP puro na rede interna: com estes ligados o login não grava o cookie
    # (cookie Secure só viaja em HTTPS) e o redirect para https quebra tudo.
    # Quem puser um proxy TLS na frente liga os quatro de volta no .env.local.
    DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-False}
    DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-False}
    DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-False}
    DJANGO_AUTH_COOKIE_SECURE: ${DJANGO_AUTH_COOKIE_SECURE:-False}
    # O papel deste nó. Fixado aqui, e não no `.env.local`, para uma loja não
    # virar nuvem por um typo no arquivo que o cliente edita. A faixa de
    # numeração de pedido segue o `SyncNode` provisionado; o resto da
    # sincronização lê daqui.
    SYNC_NODE_TYPE: local
    # A versão que a loja anuncia no HELLO é a da imagem que está rodando —
    # nunca uma cópia à mão que envelhece (o exemplo antigo dizia 3.0.14).
    SYNC_APP_VERSION: ${STARCHEF_VERSION}
    SYNC_ENROLL_ENV_PATH: /app/sync/credentials.env
  volumes:
    - backend_media:/app/media
    - backend_static:/app/staticfiles
    # As credenciais que a matrícula recebe da nuvem são gravadas aqui. Sem
    # este volume elas valeriam só até o container reiniciar.
    - sync_credentials:/app/sync
    # Os pedaços de arquivo em trânsito ficam em `media/sync_tmp/`, DENTRO do
    # volume acima — não num volume próprio. Um segundo volume montado ali
    # nasce como root, e o container roda como uid 1000: toda gravação de
    # pedaço falhava com "Permission denied".
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - starchef-local

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-starchef_local}
      POSTGRES_USER: ${POSTGRES_USER:-starchef}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD é obrigatório}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Sem porta publicada: o banco da loja só é acessível na rede do compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-starchef} -d ${POSTGRES_DB:-starchef_local}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - starchef-local

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    logging: *default-logging
    # `appendonly yes` porque o Redis aqui também é broker do Celery: sem
    # persistência, reiniciar o container descartaria tarefas enfileiradas.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "${REDIS_MAXMEMORY:-192mb}", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - starchef-local

  backend:
    <<: *backend-base
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}
    # `sync_install_triggers` depois do migrate: a rede de segurança que
    # captura escrita feita por fora do ORM. Idempotente, roda em todo boot.
    #
    # `check` no FIM, onde quem sobe a loja está olhando, e SEM derrubar o
    # boot — daí o `|| true` entre parênteses: `A && B || true && C` agruparia
    # como `((A && B) || true) && C`, e o gunicorn subiria com o migrate
    # falhando.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py sync_install_triggers &&
             (python manage.py check || true) &&
             gunicorn config.asgi:application -c gunicorn.conf.py"
    # A porta direta da API continua publicada: PDVs já instalados apontam
    # para `http://IP:8000/api/v1`, e trocar o endereço de cada terminal no
    # dia da migração é o tipo de passo que fica pela metade. Os novos podem
    # usar a porta única do proxy (`http://IP/api/v1`).
    ports:
      - "${BACKEND_BIND:-0.0.0.0}:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Primeira subida: migrations num banco vazio + collectstatic + triggers
      # passam de `interval × retries`. Sem esta folga o container era marcado
      # unhealthy antes de o gunicorn abrir a porta, e quem esperava por ele
      # (sync_worker, proxy) nunca começava.
      start_period: 180s

  celery_worker:
    <<: *backend-base
    mem_limit: ${CELERY_WORKER_MEM_LIMIT:-768m}
    # As filas `sync.*` entram junto com a default: numa loja não compensa um
    # processo por fila, e o volume é baixo. Fila vazia não custa nada.
    command: >
      celery -A config worker -l info
      --concurrency=${CELERY_CONCURRENCY:-2}
      -Q celery,sync.dispatch,sync.receive,sync.apply,sync.bootstrap,sync.retry,sync.reconcile,sync.cleanup
    depends_on:
      backend:
        condition: service_healthy

  celery_beat:
    <<: *backend-base
    mem_limit: ${CELERY_BEAT_MEM_LIMIT:-256m}
    command: celery -A config beat -l info
    depends_on:
      backend:
        condition: service_healthy

  sync_worker:
    <<: *backend-base
    mem_limit: ${SYNC_WORKER_MEM_LIMIT:-512m}
    # Com a sincronização DESLIGADA o `sync_worker` aborta — e com `restart:
    # unless-stopped` o Docker o religaria em laço para sempre, enchendo o log.
    # Então ele só roda quando ligada; desligada, o container fica parado de
    # propósito (dormindo), sem erro. Ligar depois é mudar o .env.local e dar
    # `up -d`.
    command: >
      sh -c 'if [ "$${SYNC_ENABLED:-false}" = "true" ]; then
               exec python manage.py sync_worker --interval $${SYNC_INTERVAL:-2} --heartbeat $${SYNC_HEARTBEAT:-20};
             else
               echo "Sincronização com a nuvem DESLIGADA (SYNC_ENABLED=false). Esta loja opera sozinha.";
               exec sleep infinity;
             fi'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Não testa a nuvem: loja sem internet é estado NORMAL, e um healthcheck
      # que reprovasse isso faria o Docker acusar problema justamente quando a
      # loja está se virando sozinha.
      test: ["CMD-SHELL", "[ \"$${SYNC_ENABLED:-false}\" != \"true\" ] || python manage.py sync_status --quiet > /dev/null"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 90s

  frontend:
    image: "${FRONTEND_IMAGE:-ghcr.io/matheus-matta/starchef-frontend:${STARCHEF_VERSION}}"
    restart: unless-stopped
    mem_limit: ${FRONTEND_MEM_LIMIT:-256m}
    logging: *default-logging
    environment:
      # Mesma origem: o navegador fala com o proxy, que manda /api para o
      # backend. Sem CORS, e o cookie de login (SameSite=Lax) funciona.
      API_URL: /api/v1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - starchef-local

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: ${PROXY_MEM_LIMIT:-128m}
    logging: *default-logging
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - starchef-local

volumes:
  postgres_data:
  redis_data:
  backend_media:
  backend_static:
  sync_credentials:
  caddy_data:

networks:
  starchef-local:
    driver: bridge
