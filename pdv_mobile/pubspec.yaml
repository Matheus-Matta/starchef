name: starchef_pdv_mobile
description: "StarChef PDV Mobile — atendimento e impressão direto no backend."
publish_to: 'none'
version: 1.2.0+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_secure_storage: 10.3.1
  http: ^1.6.0
  path_provider: ^2.1.5
  shadcn_ui: 0.56.1
  # Atualizacao do app. As MESMAS versoes do PDV desktop de proposito: os dois
  # leem manifesto publicado pelo mesmo release, e divergir aqui faria um
  # verificar SHA-256 diferente do outro.
  crypto: ^3.0.6
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/master.png
