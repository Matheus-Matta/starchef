# O proxy da NUVEM, atrás da Cloudflare em SSL "Full (strict)".
#
# Copie esta pasta para /opt/nginx no servidor (ver README.md ao lado):
#   api.starchef.com.br → backend (API, /ws, /admin, /static, /media)
#   app.starchef.com.br → frontend (o painel)
#
# "Full (strict)" = a Cloudflare só fala com esta origem em HTTPS e exige um
# certificado VÁLIDO: o Origin Certificate da Cloudflare em
# /opt/nginx/certs/origin.pem e origin.key. Sem ele o nginx não sobe.
user  nginx;
worker_processes  auto;
error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    # `rt` = tempo total que o nginx viu; `urt` = quanto desse tempo foi o
    # backend. rt alto com urt baixo = o atraso está no caminho (cliente,
    # Cloudflare); urt alto = é o Django/banco. Sem isso não dá para saber.
    log_format timed '$remote_addr "$request" $status $body_bytes_sent '
                     'rt=$request_time urt=$upstream_response_time '
                     'uct=$upstream_connect_time';
    access_log    /dev/stdout timed;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;
    client_max_body_size 20m;

    # O DNS do Docker, relido a cada 10 s: um `docker compose up -d` que
    # recria o backend troca o IP dele, e um nginx que resolveu o nome só no
    # boot passava a responder 502 até ser reiniciado também.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Rate limiting por IP ────────────────────────────────────────────────
    # Um IP aqui é uma LOJA INTEIRA (PDVs, garçons, KDS e painel saem pelo
    # mesmo IP público). Os números são contra abuso, não uso normal: com
    # 30r/s a loja cheia batia no teto e o PDV recebia 429 ao concluir pedido.
    # A defesa fina (por conta e por usuário) é do DRF.
    limit_req_zone $binary_remote_addr zone=api:10m rate=300r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=refresh:10m rate=300r/m;
    limit_req_zone $binary_remote_addr zone=admin_login:10m rate=10r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml
               application/wasm;

    upstream backend {
        zone backend 64k;
        server backend:8000 resolve;
        # Reusa a conexão com o backend em vez de abrir uma TCP nova a cada
        # requisição (o log do uvicorn mostrava HTTP/1.0 = sem keep-alive).
        keepalive 32;
    }

    upstream frontend {
        zone frontend 64k;
        server frontend:8080 resolve;
        # Reusa a conexão com o frontend em vez de abrir uma TCP nova a cada
        # requisição (o log do uvicorn mostrava HTTP/1.0 = sem keep-alive).
        keepalive 32;
    }

    # Sem Upgrade, Connection vazio (e não "close"): é o que deixa o
    # keepalive do upstream funcionar nas requisições HTTP normais.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Keep-alive com o upstream exige HTTP/1.1 e o Connection limpo. O header
    # vai em cada `server`: um proxy_set_header lá anula todos os daqui.
    proxy_http_version 1.1;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HTTP → HTTPS. Com "Always Use HTTPS" na Cloudflare isto quase não roda.
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Host desconhecido (IP direto, domínio errado): recusa sem responder.
    server {
        listen 443 ssl default_server;
        server_name _;
        return 444;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name api.starchef.com.br;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # O backend confia no X-Forwarded-Proto (SECURE_PROXY_SSL_HEADER):
        # ele é FIXO em https aqui — a Cloudflare em Full (strict) só chega
        # por 443, e $scheme de um cliente esperto não entra.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        $connection_upgrade;

        location ~ ^/api/v1/auth/(login|password-reset)/ {
            limit_req zone=login burst=30 nodelay;
            proxy_pass http://backend;
        }

        location ~ ^/api/v1/auth/refresh/ {
            limit_req zone=refresh burst=100 nodelay;
            proxy_pass http://backend;
        }

        location /api/ {
            # `nodelay` é obrigatório: sem ele o nginx SEGURA o excedente na
            # fila, e o caixa vê o pedido demorar um minuto, sem erro na tela.
            limit_req zone=api burst=600 nodelay;
            limit_conn conn 300;
            proxy_pass http://backend;
        }

        # WebSocket (Channels): tempo real do painel, KDS e o sync da loja.
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        location = /admin/login/ {
            limit_req zone=admin_login burst=5 nodelay;
            proxy_pass http://backend;
        }

        location /static/ {
            access_log off;
            proxy_pass http://backend;
        }

        location /health/ {
            access_log off;
            proxy_pass http://backend;
        }

        # /admin/, /media/ e o resto do Django.
        location / {
            proxy_pass http://backend;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name app.starchef.com.br;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # O `serve` do container já manda o Cache-Control certo por caminho
        # (frontend/serve.json).
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
