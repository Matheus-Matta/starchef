name: starchef_garcom
description: "StarChef Garçom — pedidos no salão, pelo Caixa Principal."
publish_to: 'none'
version: 1.8.1+14

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  # Assinatura HMAC-SHA256 do relay com o Caixa Principal (mesmo esquema do PDV).
  crypto: ^3.0.6
  # Token do backend e chave de pareamento ficam no cofre do sistema, nunca em
  # SharedPreferences: o aparelho do garçom circula pelo salão.
  flutter_secure_storage: ^10.3.1
  # O .env do app guarda só o endereço do backend — no celular não existe
  # arquivo ao lado do executável, então ele é embarcado como asset.
  flutter_dotenv: ^6.0.0
  shadcn_ui: 0.56.1
  # Diretório de dados do app (fila offline) — não existe forma pura em
  # dart:io de achar esse caminho em Android/iOS.
  path_provider: ^2.1.5
  mobile_scanner: ^7.4.0
  open_filex: ^4.7.0
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Gera os ícones nativos (Android/iOS) a partir de assets/icon — rodar
  # `dart run flutter_launcher_icons` depois de trocar a logo.
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    # Marca usada dentro do app (AuthScaffold) — mesmo arquivo que gera o
    # ícone nativo, ver flutter_launcher_icons abaixo.
    - assets/icon/master.png

# Config do flutter_launcher_icons (lido pelo `dart run flutter_launcher_icons`).
# assets/icon/master.png é uma cópia EXATA (mesmo md5) de
# frontend/public/logoicon.png — não é redesenhado nem recortado, é o mesmo
# arquivo usado tal como está, inclusive para a camada de frente do ícone
# adaptativo do Android (o fundo sólido por trás cobre os cantos
# transparentes do PNG original com a mesma cor, sem costura visível).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/master.png"
  adaptive_icon_background: "#EA580C"
  adaptive_icon_foreground: "assets/icon/master.png"
  min_sdk_android: 21
