# Imagens publicadas pelo CI em ghcr.io.
# O arquivo `.env` na raiz é lido automaticamente pelo Docker Compose.
#
# Suba com:
#   docker compose pull
#   docker compose up -d
#
# Este compose não executa banco de dados nem broker de filas.
# As conexões utilizadas pelo Django e pelo Celery devem ser configuradas
# externamente por meio das variáveis presentes no arquivo `.env`.
#
# SEM nginx/TLS/rate-limit neste compose: backend e frontend publicam HTTP
# puro em loopback por padrão. TLS, proxy de /api e /ws e rate-limit devem
# ser configurados em um proxy reverso externo.
#
# Log rotation evita que os logs dos containers ocupem todo o disco.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    image: ghcr.io/matheus-matta/starchef-backend:latest
    restart: unless-stopped
    user: "1000:1000"
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}
    logging: *default-logging

    # `sync_install_triggers` depois do migrate, igual ao compose da loja: é a
    # rede de segurança do §11.2, que captura escrita feita por fora do ORM
    # (bulk_create, QuerySet.update, SQL direto). Sem ela o sistema funciona —
    # e é esse o problema: a escrita em massa deixa de virar evento sem barulho
    # nenhum, e a divergência só aparece quando alguém compara os dois bancos.
    #
    # É idempotente e tem guarda própria (não instala nada com SYNC_ENABLED
    # false), então é seguro deixar no boot de qualquer instalação. A nuvem
    # ficou de fora até aqui por esquecimento, não por decisão — e ela é
    # justamente onde escrita em massa acontece.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py sync_install_triggers &&
             gunicorn config.asgi:application -c gunicorn.conf.py"

    env_file:
      - .env

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_DEBUG: "False"

    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles

    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"

    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:8000/health/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

    networks:
      - apps_net

  celery_worker:
    image: ghcr.io/matheus-matta/starchef-backend:latest
    restart: unless-stopped
    user: "1000:1000"
    mem_limit: ${CELERY_WORKER_MEM_LIMIT:-1g}
    logging: *default-logging

    # `-Q` e OBRIGATORIO com a sincronizacao ligada. As tarefas do modulo
    # declaram fila propria (`sync.apply`, `sync.retry`, ...); um worker sem
    # `-Q` consome SO a fila `celery`, e as do sync ficam enfileiradas para
    # sempre — sem erro, sem log, sem metrica. O sintoma que chega e outro:
    # "a loja se matriculou, conectou e nao recebeu nada".
    #
    # `sync.bootstrap` NAO entra aqui de proposito: a carga total pode levar
    # horas (time_limit de 3h) e ocuparia um slot deste worker, que tambem
    # roda o `dispatch-due-kitchen-batches` a cada 5 segundos. Ela tem
    # container proprio, logo abaixo.
    #
    # Deixar as filas de sync aqui com a sincronizacao desligada nao custa
    # nada: fila vazia nao consome recurso.
    command: >
      celery -A config worker
      -l info
      --concurrency=${CELERY_CONCURRENCY:-4}
      -Q ${CELERY_QUEUES:-celery,sync.dispatch,sync.receive,sync.apply,sync.retry,sync.reconcile,sync.cleanup}

    env_file:
      - .env

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_DEBUG: "False"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - apps_net

  celery_beat:
    image: ghcr.io/matheus-matta/starchef-backend:latest
    restart: unless-stopped
    user: "1000:1000"
    mem_limit: ${CELERY_BEAT_MEM_LIMIT:-256m}
    logging: *default-logging

    command: celery -A config beat -l info

    env_file:
      - .env

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_DEBUG: "False"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - apps_net

  # A carga total, isolada do resto.
  #
  # NAO confundir com o `sync_worker` do `docker/local/`: aquele e o processo
  # da LOJA, que abre a conexao WSS para ca. Na nuvem ele nao existe — quem
  # recebe as conexoes e o proprio `backend`, pelo consumer em /ws/sync/v1/.
  # (`manage.py sync_worker` recusa rodar com SYNC_NODE_TYPE=cloud.)
  #
  # Este container consome so `sync.bootstrap`. Uma carga total varre a conta
  # inteira e pode levar horas; num worker compartilhado ela seguraria um slot
  # e atrasaria as tarefas operacionais do salao.
  celery_worker_sync:
    image: ghcr.io/matheus-matta/starchef-backend:latest
    restart: unless-stopped
    user: "1000:1000"
    mem_limit: ${CELERY_SYNC_MEM_LIMIT:-1g}
    logging: *default-logging

    # Concorrencia baixa de proposito: duas cargas simultaneas ja sao muito
    # trabalho de banco, e o proprio codigo recusa duas no mesmo no.
    command: >
      celery -A config worker
      -l info
      --concurrency=${CELERY_SYNC_CONCURRENCY:-2}
      -Q sync.bootstrap

    env_file:
      - .env

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_DEBUG: "False"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - apps_net

  frontend:
    image: ghcr.io/matheus-matta/starchef-frontend:latest
    restart: unless-stopped
    mem_limit: ${FRONTEND_MEM_LIMIT:-256m}
    logging: *default-logging

    environment:
      API_URL: ${API_URL:?API_URL é obrigatório}

    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8080}:8080"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - apps_net

volumes:
  backend_media:
  backend_static:

networks:
  apps_net:
    external: true