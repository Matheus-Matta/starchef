# Imagens publicadas pelo CI em ghcr.io.
# O arquivo `.env` na raiz é lido automaticamente pelo Docker Compose.
#
# Suba com:
#   docker compose pull
#   docker compose up -d
#
# Este compose não executa o banco de dados (POSTGRES_* no `.env`). O Redis
# (cache, Channels e fila do Celery) roda aqui, no `starchef-redis`, com a
# senha de REDIS_PASSWORD.
#
# O `nginx` é a única porta pública (80/443), atrás da Cloudflare em SSL
# "Full (strict)": api.starchef.com.br → backend, app.starchef.com.br →
# frontend. A configuração e o certificado de origem moram em /opt/nginx
# (NGINX_DIR), copiados de nginx/ — ver nginx/README.md.
# Backend e frontend continuam publicados só em loopback, para diagnóstico.
#
# Log rotation evita que os logs dos containers ocupem todo o disco.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# As três URLs do Redis saem de UMA senha (REDIS_PASSWORD). Ficam aqui, e não
# no `.env`, porque o `environment:` vence o `env_file:`: uma URL velha no
# `.env` (apontando para o Redis compartilhado de antes) não tem como ganhar.
# A senha vai dentro da URL: use só letras e números (`openssl rand -hex 32`).
x-redis-env: &redis-env
  REDIS_URL: redis://:${REDIS_PASSWORD}@starchef-redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@starchef-redis:6379/1
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@starchef-redis:6379/2

services:
  backend:
    image: ghcr.io/matheus-matta/starchef-backend:latest
    restart: unless-stopped
    user: "1000:1000"
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}
    logging: *default-logging

    # `sync_install_triggers` depois do migrate, igual ao compose da loja: é a
    # rede de segurança do §11.2, que captura escrita feita por fora do ORM
    # (bulk_create, QuerySet.update, SQL direto). Sem ela o sistema funciona —
    # e é esse o problema: a escrita em massa deixa de virar evento sem barulho
    # nenhum, e a divergência só aparece quando alguém compara os dois bancos.
    #
    # É idempotente e tem guarda própria (não instala nada com SYNC_ENABLED
    # false), então é seguro deixar no boot de qualquer instalação. A nuvem
    # ficou de fora até aqui por esquecimento, não por decisão — e ela é
    # justamente onde escrita em massa acontece.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py sync_install_triggers &&
             gunicorn config.asgi:application -c gunicorn.conf.py"

    env_file:
      - .env

    environment:
      <<: *redis-env
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_DEBUG: "False"
      # O emissor ACBrLib: o do `.env` (ACBRLIB_URL), ou o desta nuvem.
      ACBRLIB_URL: ${ACBRLIB_URL:-http://fiscal-acbr:8001}

    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles

    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"

    depends_on:
      starchef-redis:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:8000/health/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

    networks:
      - apps_net

  celery_worker:
    image: ghcr.io/matheus-matta/starchef-backend:latest
    restart: unless-stopped
    user: "1000:1000"
    mem_limit: ${CELERY_WORKER_MEM_LIMIT:-1g}
    # Teto de CPU: o worker é trabalho de fundo e não pode tirar a CPU do
    # backend. Sem ele, um acúmulo de tarefas segurou 300% numa máquina de 2
    # vCPU e o painel passou a responder em 1,5 s.
    cpus: ${CELERY_WORKER_CPUS:-1.0}
    logging: *default-logging

    # `-Q` e OBRIGATORIO com a sincronizacao ligada. As tarefas do modulo
    # declaram fila propria (`sync.apply`, `sync.retry`, ...); um worker sem
    # `-Q` consome SO a fila `celery`, e as do sync ficam enfileiradas para
    # sempre — sem erro, sem log, sem metrica. O sintoma que chega e outro:
    # "a loja se matriculou, conectou e nao recebeu nada".
    #
    # `sync.bootstrap` NAO entra aqui de proposito: a carga total pode levar
    # horas (time_limit de 3h) e ocuparia um slot deste worker, que tambem
    # roda o `dispatch-due-kitchen-batches` a cada 5 segundos. Ela tem
    # container proprio, logo abaixo.
    #
    # Deixar as filas de sync aqui com a sincronizacao desligada nao custa
    # nada: fila vazia nao consome recurso.
    command: >
      celery -A config worker
      -l info
      --concurrency=${CELERY_CONCURRENCY:-2}
      -Q ${CELERY_QUEUES:-celery,sync.dispatch,sync.receive,sync.apply,sync.retry,sync.reconcile,sync.cleanup}

    env_file:
      - .env

    environment:
      <<: *redis-env
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_DEBUG: "False"
      # O emissor ACBrLib: o do `.env` (ACBRLIB_URL), ou o desta nuvem.
      ACBRLIB_URL: ${ACBRLIB_URL:-http://fiscal-acbr:8001}

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - apps_net

  celery_beat:
    image: ghcr.io/matheus-matta/starchef-backend:latest
    restart: unless-stopped
    user: "1000:1000"
    mem_limit: ${CELERY_BEAT_MEM_LIMIT:-256m}
    cpus: ${CELERY_BEAT_CPUS:-0.25}
    logging: *default-logging

    command: celery -A config beat -l info

    env_file:
      - .env

    environment:
      <<: *redis-env
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_DEBUG: "False"
      # O emissor ACBrLib: o do `.env` (ACBRLIB_URL), ou o desta nuvem.
      ACBRLIB_URL: ${ACBRLIB_URL:-http://fiscal-acbr:8001}

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - apps_net

  # A carga total, isolada do resto.
  #
  # NAO confundir com o `sync_worker` do `docker/local/`: aquele e o processo
  # da LOJA, que abre a conexao WSS para ca. Na nuvem ele nao existe — quem
  # recebe as conexoes e o proprio `backend`, pelo consumer em /ws/sync/v1/.
  # (`manage.py sync_worker` recusa rodar com SYNC_NODE_TYPE=cloud.)
  #
  # Este container consome so `sync.bootstrap`. Uma carga total varre a conta
  # inteira e pode levar horas; num worker compartilhado ela seguraria um slot
  # e atrasaria as tarefas operacionais do salao.
  celery_worker_sync:
    image: ghcr.io/matheus-matta/starchef-backend:latest
    restart: unless-stopped
    user: "1000:1000"
    mem_limit: ${CELERY_SYNC_MEM_LIMIT:-1g}
    cpus: ${CELERY_SYNC_CPUS:-0.5}
    logging: *default-logging

    # Concorrencia baixa de proposito: duas cargas simultaneas ja sao muito
    # trabalho de banco, e o proprio codigo recusa duas no mesmo no.
    command: >
      celery -A config worker
      -l info
      --concurrency=${CELERY_SYNC_CONCURRENCY:-1}
      -Q sync.bootstrap

    env_file:
      - .env

    environment:
      <<: *redis-env
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_DEBUG: "False"
      # O emissor ACBrLib: o do `.env` (ACBRLIB_URL), ou o desta nuvem.
      ACBRLIB_URL: ${ACBRLIB_URL:-http://fiscal-acbr:8001}

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - apps_net

  # Cache, camada do Channels (tempo real e sync) e fila do Celery.
  #
  # O nome NÃO é `redis`: a `apps_net` é compartilhada com outros apps do
  # servidor, e um `redis` de outro app no mesmo nome faria o DNS do Docker
  # sortear entre os dois — o backend gravaria a sessão num e leria no outro.
  #
  # `noeviction`: cheio, recusa escrita em vez de descartar chave. Descartar
  # some com tarefa do Celery da fila, sem erro nenhum. AOF (appendonly)
  # guarda a fila no volume: reiniciar o container não perde tarefa.
  # Sem porta publicada: só os containers da rede falam com ele.
  starchef-redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    logging: *default-logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD é obrigatório}
    # A senha pela env, não na linha de comando: assim ela não aparece no
    # `docker inspect` nem no `ps` do host.
    command: >
      sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD"
      --appendonly yes --maxmemory-policy noeviction'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - apps_net

  # O emissor fiscal ACBrLib DA NUVEM (docs/FISCAL_ACBRLIB.md). Sobe sempre,
  # como na loja: conta sem servidor local (delivery, site) emite por aqui, em
  # homologação ou produção — o ambiente vem de cada nota, do cadastro fiscal
  # do restaurante. O backend o acha em ACBRLIB_URL (`.env`; vazio = este).
  #
  # A libacbrnfe64.so (Projeto ACBr) fica em ./acbr/libs. Sem ela o serviço
  # sobe "unhealthy" e responde "ACBrLib não instalada" — nunca simula. Sem
  # porta publicada: só o backend e o Celery falam com ele, pela rede interna.
  fiscal-acbr:
    image: ghcr.io/matheus-matta/starchef-fiscal-acbr:latest
    restart: unless-stopped
    mem_limit: ${ACBR_MEM_LIMIT:-256m}
    logging: *default-logging
    environment:
      ACBRLIB_TOKEN: ${ACBRLIB_TOKEN:-}
    volumes:
      - ./acbr/libs:/app/libs:ro
      - fiscal_acbr_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - apps_net

  frontend:
    image: ghcr.io/matheus-matta/starchef-frontend:latest
    restart: unless-stopped
    mem_limit: ${FRONTEND_MEM_LIMIT:-256m}
    logging: *default-logging

    environment:
      API_URL: ${API_URL:?API_URL é obrigatório}

    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8080}:8080"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - apps_net

  nginx:
    # 1.28: o `resolve` no upstream (open source desde 1.27.3) relê o IP do
    # backend recriado por um `up -d`; sem ele o proxy respondia 502.
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    mem_limit: ${NGINX_MEM_LIMIT:-128m}
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${NGINX_DIR:-/opt/nginx}/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${NGINX_DIR:-/opt/nginx}/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "nginx -t -q || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks:
      - apps_net

volumes:
  redis_data:
  backend_media:
  backend_static:
  fiscal_acbr_data:

networks:
  apps_net:
    external: true