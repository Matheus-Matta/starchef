# Imagens publicadas pelo CI em ghcr.io (backend/frontend só saem em tag de
# release — ver .github/workflows/{backend,frontend}.yml), settings de produção,
# gunicorn+UvicornWorker. `.env` na raiz é lido automaticamente pelo Compose.
# Suba com:
#   docker compose pull
#   docker compose up -d
# Imagens fixas em `:latest` (backend e frontend) — sempre a última tag de
# release publicada pelo CI.
#
# SEM nginx/TLS/rate-limit neste compose: backend e frontend publicam HTTP
# puro (em loopback por padrão — ver BACKEND_BIND/FRONTEND_BIND). TLS,
# proxy same-origin de /api e /ws, e rate-limit de borda são responsabilidade
# de um proxy reverso EXTERNO a este arquivo (nginx do host, Caddy, LB da
# nuvem etc.) — ver infra/reverse-proxy.example.conf como ponto de partida.
#
# Limites de memória/CPU abaixo são conservadores para uma VPS pequena (ajuste
# via env se o servidor tiver mais recursos) — sem eles, um vazamento em
# qualquer serviço pode consumir toda a RAM do host e derrubar os outros.
# Log rotation (json-file) evita disco cheio por log de container sem limite.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    cpus: ${POSTGRES_CPUS:-1.0}
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-starchef}
      POSTGRES_USER: ${POSTGRES_USER:-starchef}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD é obrigatório em produção}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Sem portas expostas ao host: só acessível na rede interna do compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-starchef} -d ${POSTGRES_DB:-starchef}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - starchef

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - starchef

  backend:
    image: ghcr.io/matheus-matta/starchef-backend:latest
    restart: unless-stopped
    user: "1000:1000"
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}
    logging: *default-logging
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.asgi:application -c gunicorn.conf.py"
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_DEBUG: "False"
    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    # Publicado em loopback por padrão: o backend confia em X-Forwarded-Proto/
    # X-Forwarded-For de quem se conectar nele (SECURE_PROXY_SSL_HEADER), então
    # só deve ficar acessível pelo proxy reverso externo. Se esse proxy rodar
    # em outra máquina, troque BACKEND_BIND para 0.0.0.0 e restrinja o acesso
    # via firewall/security group só ao IP do proxy.
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - starchef

  celery_worker:
    image: ghcr.io/matheus-matta/starchef-backend:latest
    restart: unless-stopped
    user: "1000:1000"
    mem_limit: ${CELERY_WORKER_MEM_LIMIT:-1g}
    logging: *default-logging
    command: celery -A config worker -l info --concurrency=${CELERY_CONCURRENCY:-4}
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_DEBUG: "False"
    depends_on:
      - backend
      - redis
      - postgres
    networks:
      - starchef

  celery_beat:
    image: ghcr.io/matheus-matta/starchef-backend:latest
    restart: unless-stopped
    user: "1000:1000"
    mem_limit: ${CELERY_BEAT_MEM_LIMIT:-256m}
    logging: *default-logging
    command: celery -A config beat -l info
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_DEBUG: "False"
    depends_on:
      - backend
      - redis
      - postgres
    networks:
      - starchef

  # SPA (Vue) já compilado dentro da imagem, servido em HTTP puro pelo `serve`
  # (sem nginx). TLS e o proxy same-origin de /api e /ws ficam a cargo do
  # proxy reverso externo (ver comentário no topo do arquivo).
  frontend:
    image: ghcr.io/matheus-matta/starchef-frontend:latest
    environment:
      # Injetada pelo entrypoint no start do container (runtime-config.js via
      # sed — a mesma imagem serve qualquer ambiente sem rebuild), mas o
      # valor tem que vir do `.env` explicitamente, sem fallback silencioso.
      API_URL: ${API_URL:?API_URL é obrigatório}
    restart: unless-stopped
    mem_limit: ${FRONTEND_MEM_LIMIT:-256m}
    logging: *default-logging
    # Publicado em loopback por padrão — mesmo raciocínio do backend: quem
    # termina TLS e expõe pra internet é o proxy reverso externo.
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8080}:8080"
    depends_on:
      - backend
    networks:
      - starchef

volumes:
  postgres_data:
  redis_data:
  backend_media:
  backend_static:

networks:
  starchef:
    driver: bridge
