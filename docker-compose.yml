# Imagens publicadas pelo CI em ghcr.io (backend/frontend só saem em tag de
# release — ver .github/workflows/{backend,frontend}.yml), settings de produção,
# gunicorn+UvicornWorker, nginx na borda com TLS/rate-limit e estáticos servidos
# direto. `.env` na raiz é lido automaticamente pelo Compose. Suba com:
#   docker compose pull
#   docker compose up -d
# Pinar uma versão específica (em vez de `latest`): defina BACKEND_IMAGE_TAG e
# FRONTEND_IMAGE_TAG no `.env` (ex.: BACKEND_IMAGE_TAG=1.4.0).
#
# Limites de memória/CPU abaixo são conservadores para uma VPS pequena (ajuste
# via env se o servidor tiver mais recursos) — sem eles, um vazamento em
# qualquer serviço pode consumir toda a RAM do host e derrubar os outros.
# Log rotation (json-file) evita disco cheio por log de container sem limite.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    cpus: ${POSTGRES_CPUS:-1.0}
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-starchef}
      POSTGRES_USER: ${POSTGRES_USER:-starchef}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD é obrigatório em produção}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Sem portas expostas ao host: só acessível na rede interna do compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-starchef} -d ${POSTGRES_DB:-starchef}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - starchef

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - starchef

  backend:
    image: ghcr.io/matheus-matta/starchef-backend:${BACKEND_IMAGE_TAG:-latest}
    restart: unless-stopped
    user: "1000:1000"
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}
    logging: *default-logging
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.asgi:application -c gunicorn.conf.py"
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_DEBUG: "False"
    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - starchef

  celery_worker:
    image: ghcr.io/matheus-matta/starchef-backend:${BACKEND_IMAGE_TAG:-latest}
    restart: unless-stopped
    user: "1000:1000"
    mem_limit: ${CELERY_WORKER_MEM_LIMIT:-1g}
    logging: *default-logging
    command: celery -A config worker -l info --concurrency=${CELERY_CONCURRENCY:-4}
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_DEBUG: "False"
    depends_on:
      - backend
      - redis
      - postgres
    networks:
      - starchef

  celery_beat:
    image: ghcr.io/matheus-matta/starchef-backend:${BACKEND_IMAGE_TAG:-latest}
    restart: unless-stopped
    user: "1000:1000"
    mem_limit: ${CELERY_BEAT_MEM_LIMIT:-256m}
    logging: *default-logging
    command: celery -A config beat -l info
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_DEBUG: "False"
    depends_on:
      - backend
      - redis
      - postgres
    networks:
      - starchef

  # Borda: nginx com o SPA (Vue) já compilado dentro da imagem + proxy de /api e
  # /ws para o backend. A config e os certificados são montados por fora.
  frontend:
    image: ghcr.io/matheus-matta/starchef-frontend:${FRONTEND_IMAGE_TAG:-latest}
    environment:
      # Gerada em runtime; a mesma imagem pode ser promovida entre ambientes.
      API_URL: ${API_URL:-/api/v1}
    restart: unless-stopped
    mem_limit: ${NGINX_MEM_LIMIT:-256m}
    logging: *default-logging
    volumes:
      - ./infra/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - backend_static:/var/www/static:ro
      - backend_media:/var/www/media:ro
      # Certificados TLS (ex.: via certbot/host). Ajuste o caminho conforme seu setup.
      - ./infra/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - starchef

volumes:
  postgres_data:
  redis_data:
  backend_media:
  backend_static:

networks:
  starchef:
    driver: bridge
