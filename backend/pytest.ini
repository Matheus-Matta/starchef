[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py *_tests.py
addopts = -ra --reuse-db

# Warning de deprecação do Django vira ERRO. A suíte já roda sem nenhum, então
# o custo é zero hoje — e o ganho é que a próxima depreciação aparece no PR que
# a introduziu, não na atualização do Django que a transforma em quebra.
#
# `ignore` pontual, com o motivo, é o caminho para uma depreciação de
# dependência que não está na nossa mão resolver.
filterwarnings =
    error::django.utils.deprecation.RemovedInDjango60Warning
